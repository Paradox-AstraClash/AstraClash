<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AstraClash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: Consolas, monospace; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #gameCanvas { background-color: rgb(10, 10, 25); image-rendering: pixelated; cursor: pointer; }
    .touch-ui { position: fixed; z-index: 99; pointer-events: auto; display: none; }
    /* Virtual joystick — left side */
    .joy-wrap {
      bottom: 28px; left: 18px;
      width: 130px; height: 130px;
      touch-action: none;
    }
    .joy-base {
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(15, 22, 40, 0.55);
      border: 2px solid rgba(0, 255, 255, 0.45);
      position: relative;
    }
    .joy-stick {
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(0, 255, 255, 0.35);
      border: 2px solid #00ffff;
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }
    /* Right action cluster: ability center, fire below */
    .action-pad {
      bottom: 100px; right: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .upgrade-pad { top: 70px; right: 20px; display: flex; gap: 10px; }
    .t-btn {
      background: rgba(20, 30, 50, 0.8);
      border: 2px solid #00ffff;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .t-btn:active, .t-btn.active { background: rgba(0, 255, 255, 0.4); }
    #btn-ability {
      width: 64px; height: 64px; border-radius: 50%;
      font-size: 13px;
    }
    #btn-fire {
      width: 78px; height: 78px; border-radius: 50%;
      border-color: #ff3c3c;
      background: rgba(60, 20, 25, 0.85);
      font-size: 15px;
    }
    #btn-fire:active, #btn-fire.active {
      background: rgba(255, 60, 60, 0.45);
    }
    /* Real input so mobile OS keyboards can open (canvas key events do not) */
    #mobileTextInput {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(90vw, 320px);
      height: 44px;
      z-index: 200;
      font-size: 16px; /* prevents iOS zoom on focus */
      font-family: Consolas, monospace;
      text-align: center;
      color: #fff;
      background: rgba(15, 18, 32, 0.95);
      border: 2px solid #00ffff;
      border-radius: 8px;
      outline: none;
      padding: 8px 12px;
      display: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    #mobileTextInput.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <input id="mobileTextInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" />

  <!-- Virtual joystick (move / turn) -->
  <div class="touch-ui joy-wrap" id="group-dpad">
    <div class="joy-base" id="joy-base">
      <div class="joy-stick" id="joy-stick"></div>
    </div>
  </div>

  <!-- Ability above fire (fire sits lower like a d-pad "down") -->
  <div class="touch-ui action-pad" id="group-action">
    <div class="t-btn" id="btn-ability">ABIL</div>
    <div class="t-btn" id="btn-fire">FIRE</div>
  </div>

  <div class="touch-ui upgrade-pad" id="group-upgrade">
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-1">1</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-2">2</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-3">3</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia("(pointer: coarse)").matches;
    const mobileInput = document.getElementById("mobileTextInput");
    let mobileField = null; // 'authName' | 'authDisplay' | 'authPass' | 'roomCode' | 'roomPass'

    function syncMobileFieldFromInput() {
      if (!mobileInput || !mobileField) return;
      let v = mobileInput.value || "";
      if (mobileField === "authName") {
        v = v.toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 16);
        authNameInput = v;
        if (mobileInput.value !== v) mobileInput.value = v;
      } else if (mobileField === "authDisplay") {
        v = v.slice(0, 20);
        authDisplayInput = v;
      } else if (mobileField === "authPass") {
        v = v.slice(0, 32);
        authPassInput = v;
      } else if (mobileField === "roomCode") {
        v = v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
        roomCodeInput = v;
        if (mobileInput.value !== v) mobileInput.value = v;
      } else if (mobileField === "roomPass") {
        v = v.slice(0, 16);
        passwordInput = v;
      }
    }

    function openMobileKeyboard(field) {
      if (!mobileInput) return;
      mobileField = field;
      let val = "";
      let placeholder = "Type here";
      let inputMode = "text";
      let type = "text";
      if (field === "authName") {
        val = authNameInput;
        placeholder = "USERNAME";
        mobileInput.setAttribute("autocapitalize", "none");
        authActiveField = "name";
      } else if (field === "authDisplay") {
        val = authDisplayInput;
        placeholder = "DISPLAY NAME";
        mobileInput.setAttribute("autocapitalize", "words");
        authActiveField = "display";
      } else if (field === "authPass") {
        val = authPassInput;
        placeholder = "PASSWORD";
        type = "password";
        authActiveField = "pass";
      } else if (field === "roomCode") {
        val = roomCodeInput;
        placeholder = "4-LETTER CODE";
        mobileInput.setAttribute("autocapitalize", "characters");
        activeInput = "code";
      } else if (field === "roomPass") {
        val = passwordInput;
        placeholder = "PASSWORD (optional)";
        type = "text";
        activeInput = "pass";
      }
      mobileInput.type = type === "password" ? "password" : "text";
      mobileInput.placeholder = placeholder;
      mobileInput.value = val;
      mobileInput.classList.add("visible");
      // Focus must run inside the user gesture for iOS
      setTimeout(() => {
        try {
          mobileInput.focus({ preventScroll: true });
          mobileInput.click();
        } catch (e) {
          try { mobileInput.focus(); } catch (e2) {}
        }
      }, 10);
    }

    function closeMobileKeyboard() {
      if (!mobileInput) return;
      syncMobileFieldFromInput();
      mobileField = null;
      mobileInput.blur();
      mobileInput.classList.remove("visible");
      mobileInput.value = "";
    }

    if (mobileInput) {
      mobileInput.addEventListener("input", () => syncMobileFieldFromInput());
      mobileInput.addEventListener("change", () => syncMobileFieldFromInput());
      mobileInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          syncMobileFieldFromInput();
          closeMobileKeyboard();
        }
      });
      // Keep game vars live while typing
      mobileInput.addEventListener("keyup", () => syncMobileFieldFromInput());
    }

    function updateTouchUIVisibility() {
      // Touch pads only during a live match — never on home, sign-in, lobby, or results
      const showTouch = !!(
        touchControlsEnabled
        && !inLobby
        && !matchOver
        && menuMode === "in_game"
      );
      const dpad = document.getElementById("group-dpad");
      const act = document.getElementById("group-action");
      const upg = document.getElementById("group-upgrade");
      if (dpad) dpad.style.display = showTouch ? "block" : "none";
      if (act) act.style.display = showTouch ? "flex" : "none";
      if (upg) upg.style.display = showTouch ? "flex" : "none";
    }
    updateTouchUIVisibility();

    const V_WIDTH = 1000; const V_HEIGHT = 600;
    const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
    const virtualCanvas = document.createElement("canvas"); virtualCanvas.width = V_WIDTH; virtualCanvas.height = V_HEIGHT;
    const vctx = virtualCanvas.getContext("2d");

    let canvasScale = 1; let screenShake = 0; const particles = []; const trails = [];

    function resizeWindow() {
      const winW = window.innerWidth || 1000; const winH = window.innerHeight || 600;
      canvasScale = Math.min(winW / V_WIDTH, winH / V_HEIGHT);
      canvas.width = Math.floor(V_WIDTH * canvasScale); canvas.height = Math.floor(V_HEIGHT * canvasScale);
    }
    window.addEventListener("resize", resizeWindow); resizeWindow();

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: (clientX - rect.left) / canvasScale, y: (clientY - rect.top) / canvasScale };
    }

    const RAINBOW = { 1: "rgb(255, 60, 60)", 2: "rgb(255, 140, 30)", 3: "rgb(255, 220, 50)", 4: "rgb(50, 255, 80)", 5: "rgb(30, 140, 255)", 6: "rgb(190, 70, 255)" };
    const BLACK = "rgb(10, 10, 25)"; const WHITE = "rgb(255, 255, 255)"; const CYAN = "rgb(0, 255, 255)"; const GRAY = "rgb(140, 140, 150)";
    const DARK_GRAY = "rgb(45, 50, 65)"; const XP_BG = "rgb(20, 30, 50)"; const XP_BLUE = "rgb(0, 180, 255)"; const ORE_GOLD = "rgb(255, 215, 0)";
    const ASTEROID_COLOR = "rgb(115, 110, 125)"; const ORE_ASTEROID_COLOR = "rgb(70, 95, 130)"; const BOMB_ASTEROID_COLOR = "rgb(200, 50, 50)"; const ORE_BLUE = "rgb(0, 180, 255)";
    const PANEL_BG = "rgb(15, 18, 32)"; const BORDER_COLOR = "rgb(0, 180, 255)";

    const BASE_MOVE_SPEED = 5.0; const BASE_ROT_SPEED = 4.0; const WORLD_BOUND = 2000; const ASTEROID_COUNT = 30; const SHIP_SIZE = 20;

    const UPGRADE_TREE = {
      root: { children: ["twin_cannons", "heavy_armor", "tractor_core"] },
      twin_cannons: { name: "Twin Cannons", desc: "Fire 2 parallel lasers", children: ["rapid_fire", "railgun"], apply: (p) => { p.cannons = 2; } },
      rapid_fire: { name: "Gatling Laser", desc: "Hold to fire · twice the fire rate", children: ["spread_burst", "homing_blasts"], apply: (p) => { p.cooldown_max = 0.11; p.hold_fire = true; } },
      spread_burst: { name: "Spread Burst", desc: "Fires a 3-way laser shotgun spread", children: ["rear_cannon", "heavy_slugs"], apply: (p) => { p.spread_shot = true; } },
      heavy_slugs: { name: "High-Caliber Slugs", desc: "Shots deal heavy impact damage", children: ["hyper_homing"], apply: (p) => { p.shot_damage = 2; } },
      railgun: { name: "Piercing Beam", desc: "Lasers punch through asteroids", children: ["prism_splitter", "heavy_slugs"], apply: (p) => { p.piercing = true; } },
      rear_cannon: { name: "Rear Defense", desc: "Fires an extra laser backwards", children: ["upgraded_body"], apply: (p) => { p.rear_cannon = true; } },
      prism_splitter: { name: "Prism Splitter", desc: "Lasers deal bonus damage", children: ["super_prism"], apply: (p) => { p.shot_damage = 2; } },
      homing_blasts: { name: "Hunter Torpedoes", desc: "Fires seeking missile torpedoes (1 dmg)", children: ["hyper_homing"], apply: (p) => { p.laser_speed = 12.0; p.is_missile = true; p.shot_damage = 1; } },
      hyper_homing: { name: "Predator Swarm", desc: "Faster missiles, still 1 dmg each", children: ["vampire_core", "boomerang_beams"], apply: (p) => { p.shot_damage = 1; p.is_missile = true; p.laser_speed = 14.0; p.cooldown_max = Math.min(p.cooldown_max, 0.14); } },
      super_prism: { name: "Refraction Field", desc: "Split lasers pierce and shred", children: ["tachyon_lance", "targeting_optics"], apply: (p) => { p.piercing = true; p.shot_damage = 3; } },
      heavy_armor: { name: "Heavy Plating", desc: "Max HP boosted to 12", children: ["battering_ram", "afterburners"], apply: (p) => { p.max_hp = 12; p.hp = 12; } },
      battering_ram: { name: "Battering Ram", desc: "Heavy shove on asteroid contact", children: ["reactive_hull", "upgraded_body"], apply: (p) => { p.ram_power = 3.8; } },
      reactive_hull: { name: "Reactive Armor", desc: "Max HP boosted to 14", children: ["reinforced_bulkheads"], apply: (p) => { p.max_hp = 14; p.hp = 14; } },
      reinforced_bulkheads: { name: "Reinforced Bulkheads", desc: "Boosts hull durability to 18 HP", children: ["barrier_blast"], apply: (p) => { p.max_hp = 18; p.hp = 18; } },
      afterburners: { name: "Afterburners", desc: "Speed boosted by +40%", children: ["ion_wake", "upgraded_body"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.4; } },
      ion_wake: { name: "Ion Wake", desc: "Further boosts engine speed by +20%", children: ["plasma_overdrive"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.6; } },
      upgraded_body: { name: "Upgraded Body", desc: "Increases max HP and armor", children: ["titan_body"], apply: (p) => { p.max_hp += 2; p.hp += 2; } },
      barrier_blast: { name: "Aegis Overload", desc: "Titan hull upgraded to 22 HP", children: ["nanite_scavenger", "stasis_field"], apply: (p) => { p.max_hp = 22; p.hp = 22; } },
      plasma_overdrive: { name: "Plasma Tempest", desc: "Speed boosted by +80%", children: ["phase_dash", "flak_shotgun"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.8; } },
      titan_body: { name: "Titan Body", desc: "Max HP boosted by +6", children: ["proximity_mines", "stasis_field"], apply: (p) => { p.max_hp += 6; p.hp += 6; } },
      tractor_core: { name: "Tractor Core", desc: "3x magnet range & faster collection", children: ["ore_transmuter", "slingshot_tether"], apply: (p) => { p.magnet_range = 350; p.orb_accel = 0.18; } },
      ore_transmuter: { name: "Ore Transmuter", desc: "+50% XP from all blue ores", children: ["ore_siphon", "upgraded_body"], apply: (p) => { p.xp_mult = 1.5; } },
      ore_siphon: { name: "Ore Siphon", desc: "Ores yield +100% more Ore Mana", children: ["auxiliary_battery"], apply: (p) => { p.mana_mult = 2.0; } },
      auxiliary_battery: { name: "Auxiliary Battery", desc: "Increases max Ore Mana by +60", children: ["singularity_core"], apply: (p) => { p.max_mana = 160.0; p.mana += 60.0; } },
      slingshot_tether: { name: "Slingshot Core", desc: "Turning agility doubled", children: ["gravity_repulsor"], apply: (p) => { p.rot_speed = BASE_ROT_SPEED * 1.8; } },
      gravity_repulsor: { name: "Gravity Repulsor", desc: "+30% thrust speed", children: ["singularity_core"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.3; } },
      singularity_core: { name: "Singularity Core", desc: "Massive screen-wide magnet range", children: ["stasis_field", "phase_dash"], apply: (p) => { p.magnet_range = 800; p.orb_accel = 0.28; p.move_speed = BASE_MOVE_SPEED * 1.5; } },
      nanite_scavenger: { name: "Nanite Scavenger", desc: "Collecting 5 Ores heals 1 HP", children: [], apply: (p) => { p.heal_on_ore = true; } },
      vampire_core: { name: "Vampire Core", desc: "Hitting enemies siphons and heals HP", children: [], apply: (p) => { p.life_leech = true; } },
      tachyon_lance: { name: "Tachyon Lance", desc: "Slow but massive piercing sniper shot", children: [], apply: (p) => { p.laser_speed = 35.0; p.shot_damage = 5; p.cooldown_max = 0.85; p.piercing = true; } },
      targeting_optics: { name: "Targeting Optics", desc: "Enemy markers reveal live Health Bars", children: [], apply: (p) => { p.targeting_optics = true; } },
      stasis_field: { name: "Stasis Forcefield", desc: "E raises a free shield bubble; E again launches it", children: [], apply: (p) => { p.has_stasis_field = true; } },
      phase_dash: { name: "Phase Dash", desc: "Press ABILITY (E) to warp using 40 Mana", children: [], apply: (p) => { p.can_dash = true; } },
      proximity_mines: { name: "Proximity Mines", desc: "Automatically drop red explosive mines", children: [], apply: (p) => { p.drops_mines = true; } },
      boomerang_beams: { name: "Boomerang Beams", desc: "Lasers stop and reverse direction back to you", children: [], apply: (p) => { p.boomerang = true; } },
      flak_shotgun: { name: "Flak Shotgun", desc: "Massive spread of short-range shrapnel", children: [], apply: (p) => { p.flak_mode = true; p.cooldown_max = 0.6; p.shot_damage = 2; p.laser_speed = 18.0; } }
    };

    const TIER_XP_THRESHOLDS = [0, 300, 800, 1600, 3000, 5000];
    const BOOT_TIPS = [
      "Blue ore fuels upgrades. Gold ore fully restores hull and mana.",
      "Gatling Laser is the only weapon that lets you hold fire.",
      "Missiles cost 5 mana each, launch slow then speed up, and can be shot down.",
      "Private rooms can run FFA, 3v3, or 2v2v2 with custom limits.",
      "First to the kill limit — or survive until the timer hits zero.",
      "Press E to raise a Stasis field. Press E again to launch it.",
      "A full force field protects for free. Growing it still costs mana.",
      "Off-screen rivals show as directional arrows on the edge.",
      "Asteroid bombs detonate hard. Stay clear of the blast radius.",
      "Tier 5 is max. After that, your top bar becomes pure mana.",
      "Twin Cannons and Spread Burst multiply your shot count.",
      "Phase Dash burns mana to blink forward — great for escapes.",
      "Sign in with username + password. Display name is what others see.",
      "Host leaves? World authority can desync — rejoin a fresh room.",
      "Ore magnets pull harder with Tractor and Singularity upgrades.",
      "Team modes disable friendly fire. Don't shoot your color.",
      "Hull is small. Movement and angle win more fights than raw DPS.",
      "Private match timer max is 20 minutes. Kill limit 0 means unlimited."
    ];

    // --- Lightweight Web Audio SFX (no external files) ---
    let audioCtx = null;
    // sfxMuted / sfxVolume declared with rejoin state below
    function ensureAudio() {
      if (typeof sfxMuted !== "undefined" && sfxMuted) return null;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      } catch (e) { return null; }
    }
    function playTone(freq, dur, type, vol, slideTo) {
      const ctx = ensureAudio(); if (!ctx) return;
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      const base = (vol || 0.06) * (typeof sfxVolume === "number" ? sfxVolume : 0.7);
      g.gain.setValueAtTime(Math.max(0.0001, base), t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    const SFX = {
      shoot() { playTone(420, 0.06, "square", 0.04, 180); },
      hit() { playTone(160, 0.1, "sawtooth", 0.07, 60); },
      explode() { playTone(90, 0.35, "sawtooth", 0.1, 30); playTone(50, 0.4, "triangle", 0.06, 20); },
      ore() { playTone(660, 0.08, "sine", 0.05, 990); },
      upgrade() { playTone(520, 0.08, "triangle", 0.06); setTimeout(() => playTone(780, 0.12, "triangle", 0.06), 70); },
      matchEnd() { playTone(330, 0.15, "triangle", 0.07); setTimeout(() => playTone(440, 0.2, "triangle", 0.07), 120); setTimeout(() => playTone(550, 0.35, "triangle", 0.08), 260); },
      dash() { playTone(200, 0.15, "sine", 0.05, 80); },
      shield() { playTone(300, 0.12, "sine", 0.04, 500); },
      flare() { playTone(100, 0.5, "sawtooth", 0.08, 40); }
    };
    // Unlock audio on first user gesture
    ["pointerdown", "keydown", "touchstart"].forEach(ev => {
      window.addEventListener(ev, () => ensureAudio(), { once: true, passive: true });
    });

    // --- Kill feed ---
    const killFeed = []; // { text, life }
    function pushKillFeed(text) {
      killFeed.unshift({ text: String(text), life: 4.0 });
      if (killFeed.length > 6) killFeed.pop();
    }

    // Floating hit markers / damage numbers in world space
    const floatTexts = []; // { x, y, text, life, color, vy }
    function spawnFloatText(x, y, text, color) {
      floatTexts.push({
        x: x + (Math.random() * 16 - 8),
        y: y - 10,
        text: String(text),
        life: 0.9,
        color: color || "rgb(255, 220, 80)",
        vy: -28 - Math.random() * 12
      });
      if (floatTexts.length > 40) floatTexts.shift();
    }

    // Per-match personal stats
    let matchStats = { damageDealt: 0, damageTaken: 0, oreMined: 0, timeAlive: 0, kills: 0 };
    let matchEarnedBPs = []; // color blueprint messages earned this match
    function resetMatchStats() {
      matchStats = { damageDealt: 0, damageTaken: 0, oreMined: 0, timeAlive: 0, kills: 0 };
      matchEarnedBPs = [];
    }

    // --- World events (solar flare) ---
    let worldEvent = null; // { type, timeLeft, duration }
    let worldEventCooldown = 70; // seconds until first possible flare

    // --- Host migration: lowest connected id is host ---
    function getHostId() {
      let host = Number(myId) || 1;
      for (const pid in remoteShips) {
        const id = Number(pid);
        if (Number.isFinite(id) && id < host) host = id;
      }
      return host;
    }
    function isHost() { return (Number(myId) || 1) === getHostId(); }

    // --- Rejoin last room ---
    let lastRoomCode = sessionStorage.getItem("astraclash_last_room") || "";
    let lastRoomPass = sessionStorage.getItem("astraclash_last_pass") || "";
    let rejoinPopupOpen = Boolean(lastRoomCode) && sessionStorage.getItem("astraclash_rejoin_dismissed") !== lastRoomCode;
    let sfxMuted = sessionStorage.getItem("astraclash_sfx_muted") === "1";
    let sfxVolume = 0.7; // fixed volume (settings uses touch toggle instead)
    let touchControlsEnabled = sessionStorage.getItem("astraclash_touch") === "1"
      || (sessionStorage.getItem("astraclash_touch") !== "0" && (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)));

    const stars = [];
    for (let i = 0; i < 40; i++) { stars.push({ x: Math.random() * V_WIDTH * 2, y: Math.random() * V_HEIGHT * 2, z: 0.1 + Math.random() * 0.5 }); }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 4 + 1;
        particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color, size: 2 + Math.random() * 4 });
      }
    }

    function drawCard(targetCtx, x, y, w, h, borderCol = CYAN) {
      targetCtx.fillStyle = PANEL_BG; targetCtx.fillRect(x, y, w, h);
      targetCtx.strokeStyle = borderCol; targetCtx.lineWidth = 2; targetCtx.strokeRect(x, y, w, h);
    }

          const turn = Math.max(-4, Math.min(4, diff * (0.08 + params.react)));
          c.angle = (c.angle + turn + 360) % 360;
          const spd = BASE_MOVE_SPEED * params.speed;
          const rad = c.angle * Math.PI / 180;
          c.world_x += Math.cos(rad) * spd * dt * 55;
          c.world_y -= Math.sin(rad) * spd * dt * 55;
          c.world_x = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, c.world_x));
          c.world_y = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, c.world_y));
        }
        c.fireCd = (c.fireCd || 0) - dt;
        if (best && c.fireCd <= 0 && bestD < 700 * 700) {
          const dx = best.world_x - c.world_x;
          const dy = best.world_y - c.world_y;
          let aim = Math.atan2(-dy, dx) * 180 / Math.PI;
          aim += (Math.random() - 0.5) * params.aim * 2;
          const rad = aim * Math.PI / 180;
          if (Math.random() < params.fire) {
            lasers.push({
              x: c.world_x + Math.cos(rad) * (SHIP_SIZE + 8),
              y: c.world_y - Math.sin(rad) * (SHIP_SIZE + 8),
              angle: Math.round(aim), owner: c.id, dmg: 1, pierce: false,
              speed: 12, is_missile: false, is_mine: false, boomerang: false
            });
            c.fireCd = 0.35 + Math.random() * 0.4 + (1 - params.fire) * 0.4;
          }
        }
      }
    }
    function cpuShipsPayload() {
      return Object.values(cpuShips).map(c => ({
        id: c.id, world_x: Number(c.world_x.toFixed(1)), world_y: Number(c.world_y.toFixed(1)),
        angle: Math.round(c.angle), hp: c.hp, max_hp: c.max_hp, alive: c.alive,
        xp: c.xp || 0, tier: c.tier || 0, kills: c.kills || 0,
        color: c.color, name: c.name, title: null, trail: null, is_cpu: true
      }));

    function mergeCpuShipsFromPayload(list) {
      if (!Array.isArray(list)) return;
      for (const s of list) {
        const id = Number(s.id);
        if (!Number.isFinite(id)) continue;
        remoteShips[id] = {
          id, world_x: Number(s.world_x), world_y: Number(s.world_y),
          angle: Number(s.angle) || 0, hp: Number(s.hp) || 0, max_hp: Number(s.max_hp) || 6,
          alive: s.alive !== false, xp: Number(s.xp) || 0, tier: Number(s.tier) || 0,
          kills: Number(s.kills) || 0, color: s.color || CYAN, name: s.name || `CPU ${id}`,
          title: null, trail: null, is_cpu: true
        };
      }
    }

    function applyArmedShopBoosts() {
      if (!myShip) return;
      const armed = (shopData && shopData.armed) ? shopData.armed : {};
      const inv = shopData.inv || {};
      // +1 / +2 level: grant XP threshold so upgrades are available
      let levels = 0;
      if (armed.plusLevel2 && (inv.plusLevel2 || 0) > 0) {
        levels = 2; inv.plusLevel2 -= 1; armed.plusLevel2 = false;
      } else if (armed.plusLevel && (inv.plusLevel || 0) > 0) {
        levels = 1; inv.plusLevel -= 1; armed.plusLevel = false;
      }
      if (levels > 0 && levels < TIER_XP_THRESHOLDS.length) {
        myShip.xp = Math.max(myShip.xp || 0, TIER_XP_THRESHOLDS[levels]);
        pushKillFeed(`SHOP BOOST: +${levels} LEVEL START`);
      }
      if (armed.magnetBoost && (inv.magnetBoost || 0) > 0) {
        inv.magnetBoost -= 1; armed.magnetBoost = false;
        myShip.magnet_range = Math.floor(myShip.magnet_range * 1.5);
        myShip.orb_accel = Math.min(0.35, myShip.orb_accel * 1.3);
      }
      if (armed.manaPack && (inv.manaPack || 0) > 0) {
        inv.manaPack -= 1; armed.manaPack = false;
        myShip.mana = myShip.max_mana;
      }
      if (armed.hull && (inv.hull || 0) > 0) {
        inv.hull -= 1; armed.hull = false;
        myShip.max_hp += 2; myShip.hp += 2;
      }
      if (armed.thrusters && (inv.thrusters || 0) > 0) {
        inv.thrusters -= 1; armed.thrusters = false;
        myShip.move_speed *= 1.15;
      }
      if (armed.missileBattery && (inv.missileBattery || 0) > 0) {
        inv.missileBattery -= 1; armed.missileBattery = false;
        myShip._freeMissiles = 5;
      }
      if (armed.secondWind && (inv.secondWind || 0) > 0) {
        inv.secondWind -= 1; armed.secondWind = false;
        myShip._secondWind = true;
      }
      if (armed.killStreak && (inv.killStreak || 0) > 0) {
        inv.killStreak -= 1; armed.killStreak = false;
        shopData._killStreakLeft = 3;
      } else {
        shopData._killStreakLeft = 0;
      }
      // Module blueprint — only the equipped one applies (own many, equip one)
      const eqBpId = shopData.activeBlueprint;
      if (eqBpId && shopData.inv && (shopData.inv.blueprints || []).includes(eqBpId)) {
        const bp = SHOP_BLUEPRINTS.find(b => b.id === eqBpId);
        if (bp && UPGRADE_TREE[bp.node]) {
          const node = UPGRADE_TREE[bp.node];
          if (node.apply) {
            try { node.apply(myShip); } catch (e) {}
            myShip.current_node = bp.node;
            if ((myShip.tier || 0) < 1) myShip.tier = 1;
            if ((myShip.xp || 0) < TIER_XP_THRESHOLDS[1]) myShip.xp = TIER_XP_THRESHOLDS[1];
            pushKillFeed(`BP EQUIPPED: ${bp.name.replace("BP: ", "")}`);
          }
        }
      }
      shopData.inv = inv;
      shopData.armed = armed;
      saveShop(shopData);
    }
    function setLobbyState(val) {
      const wasLobby = inLobby;
      inLobby = val;
      updateTouchUIVisibility();
      if (!val) {

              });

          }

    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return true;
      try {
        isConnecting = true;
        connectionError = false;
        connectStartTime = performance.now();
        connectOpenedAt = 0;
        ws = new WebSocket(RENDER_URL);
        statusMessage = "Booting up servers..."; statusColor = RAINBOW[3];
        
        ws.onopen = () => { 
          isConnected = true;
          isConnecting = false;
          connectionError = false;
          connectOpenedAt = performance.now();
          statusMessage = "Servers online."; 
          statusColor = RAINBOW[4];
          // Stay on connecting screen briefly so the boot bar can finish cleanly
          // (menu advances from the render/tick path below)
        };

        ws.onmessage = (event) => { 
          try { 
            const data = JSON.parse(event.data);
            handleNetworkMessage(data); 
          } catch(e) {} 
        };
        
        ws.onerror = () => { 
          isConnected = false;
          isConnecting = false;
          connectionError = true;
          statusMessage = "Could not reach the servers."; 
          statusColor = RAINBOW[1];
          if (inLobby) menuMode = "connecting";
        };

        ws.onclose = () => { 
          isConnected = false;
          isConnecting = false;
          statusMessage = "Disconnected from server."; 
          statusColor = RAINBOW[1];
          if (inLobby) {
            menuMode = "connecting";
            connectionError = true;
          }
        };
        return true;
      } catch (err) {
        isConnected = false;
        isConnecting = false;
        connectionError = true;
        statusMessage = "Connection error. Retrying may help."; 
        statusColor = RAINBOW[1]; 
        return false;
      }
    }

    function sendMsg(payload) { 
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify(payload)); 
        } catch(e) {}
      }
    }

    function recordAccountStat(stat, val) {
      if (!activePilot) return;
      const accs = getAccounts();
      const key = activePilot.username || activePilot.handle;
      if (!key) return;
      if (!accs[key]) {
        accs[key] = { username: key, career_xp: 0, kills: 0, asteroids: 0, highest_tier: 0 };
      }
      accs[key][stat] = (accs[key][stat] || 0) + val;
      saveAccounts(accs);

      activePilot.career_xp = accs[key].career_xp || 0;
      activePilot.kills = accs[key].kills || 0;
      activePilot.asteroids = accs[key].asteroids || 0;
      activePilot.highest_tier = accs[key].highest_tier || 0;
      sessionStorage.setItem("astraclash_current_user", JSON.stringify(activePilot));
    }

    function takeDamage(dmg) {
      if (!myShip || !myShip.alive || myShip.hp <= 0 || myShip.stasis_timer > 0) return;
      if ((myShip.invuln_timer || 0) > 0) return;
      screenShake = Math.min((Number.isFinite(screenShake) ? screenShake : 0) + 5, 20); 
      let amount = Number(dmg) || 1;
      try { SFX.hit(); } catch (e) {}
      // Active force field absorbs hits until it breaks
      if (myShip.is_charging_shield && (myShip.shield_charge || 0) > 0) {
        const absorb = Math.min(amount, myShip.shield_charge);
        myShip.shield_charge = Math.max(0, myShip.shield_charge - absorb);
        amount -= absorb;
        if (myShip.shield_charge <= 0.05) {
          myShip.is_charging_shield = false;
          myShip.shield_charge = 0;
          spawnParticles(myShip.world_x, myShip.world_y, CYAN, 10);
        }
        if (amount <= 0) return;
      }
      if (amount > 0) {
        matchStats.damageTaken += amount;
        spawnFloatText(myShip.world_x, myShip.world_y, `-${Math.round(amount)}`, "rgb(255, 90, 90)");
      }
      myShip.hp = Math.max(0, (Number.isFinite(myShip.hp) ? myShip.hp : 6) - amount);
      if (myShip.hp > 0 && myShip.hp < 2 && myShip._secondWind) {
        myShip._secondWind = false;
        myShip.hp = Math.min(myShip.max_hp, myShip.hp + 3);
        spawnFloatText(myShip.world_x, myShip.world_y - 24, "SECOND WIND", RAINBOW[4]);
        pushKillFeed("SECOND WIND — HULL PATCHED");
      }
      if (myShip.hp <= 0) wipeShipOnDeath();
    }

    function handleNetworkMessage(msg) {
      if (!msg) return;
      const action = msg.action; 
      const status = msg.status;

      if (action === "lobby_state") {
        lobbyRoster = Array.isArray(msg.roster) ? msg.roster : [];
        lobbyMatchStarted = !!msg.match_started;
        lobbyAllowLateJoin = !!msg.allow_late_join;
        if (msg.host_id !== undefined) lobbyHostId = Number(msg.host_id) || 1;
        if (msg.room_code) roomCode = msg.room_code;
        if (!lobbyMatchStarted && inLobby) menuMode = "waiting";
      }

      if (action === "match_start") {
        pendingJoin = false;
        if (practiceMode) leavePracticeForRealLobby();
        beginMatchFromLobby();
      }

      if (action === "player_joined") {
        // Stay in lobby until host starts (unless already in match)
        if (!lobbyMatchStarted && inLobby) menuMode = "waiting";
      }

      if (status === "ok") {
        if (msg.player_id !== undefined) { 
          myId = Number(msg.player_id) || 1; 
          initMyShip();
          if (msg.host_id !== undefined) lobbyHostId = Number(msg.host_id) || 1;
          if (msg.allow_late_join !== undefined) lobbyAllowLateJoin = !!msg.allow_late_join;
          if (msg.match_started !== undefined) lobbyMatchStarted = !!msg.match_started;
          if (pendingJoin) {
            pendingJoin = false;
            if (lobbyMatchStarted) {
              // Late join into live match
              setLobbyState(false);
              menuMode = "in_game";
            } else {
              menuMode = "waiting";
              sendMsg({ action: "set_name", name: pilotDisplayName() });
            }
          } else if (!lobbyMatchStarted) {
            menuMode = "waiting";
            sendMsg({ action: "set_name", name: pilotDisplayName() });
          }
        }
        if (msg.room_code !== undefined) {
          roomCode = msg.room_code;
          if (roomCode) {
            lastRoomCode = String(roomCode);
            sessionStorage.setItem("astraclash_last_room", lastRoomCode);
            sessionStorage.removeItem("astraclash_rejoin_dismissed");
            rejoinPopupOpen = true;
          }
        }

        if (msg.rooms !== undefined) {
          const rooms = msg.rooms;
          if (rooms.length > 0) {
            sendMsg({ action: "join_room", room_code: rooms[0], password: null, name: pilotDisplayName() });
            statusMessage = "Joining lobby...";
            pendingJoin = true;
          } else {
            sendMsg({ action: "create_room", public: true, password: null, name: pilotDisplayName(), allow_late_join: true });
            statusMessage = "Lobby created — waiting for an opponent...";
            lobbyMatchStarted = false;
            lobbyIsPublic = true;
            quickPlaySearch = true;
            menuMode = "waiting";
          }
        }
      } else if (status === "error") {
        pendingJoin = false;
        statusMessage = msg.msg || "Action failed."; 
        statusColor = RAINBOW[1];
        if (msg.action === "kicked" || (msg.msg && String(msg.msg).toLowerCase().includes("kick"))) {
          lobbyRoster = [];
          roomCode = "";
        }
        menuMode = "main";
        setLobbyState(true);
      }

      if (action === "game_packet") {
        if (inLobby && lobbyMatchStarted) setLobbyState(false);
        if (inLobby && !lobbyMatchStarted) return; // ignore combat until start
        const payload = msg.payload; 
        if (!payload) return;

        // Host-authoritative match config / clock / end state
        if (payload.match_config && !isHost()) {
          applyMatchConfig(payload.match_config);
        }
        if (payload.match_time !== undefined && !isHost()) {
          const t = Number(payload.match_time);
          if (Number.isFinite(t)) matchTimeLeft = t;
        }
        if (payload.cpu_ships) mergeCpuShipsFromPayload(payload.cpu_ships);
        if (payload.match_over && !matchOver) {
          finishMatch(payload.match_reason || "Match complete.");
        }
        if (!isHost() && payload.world_event !== undefined) {
          if (payload.world_event && payload.world_event.type) {
            const was = worldEvent && worldEvent.type;
            worldEvent = {
              type: payload.world_event.type,
              timeLeft: Number(payload.world_event.timeLeft) || 0,
              duration: Number(payload.world_event.duration) || 10
            };
            if (!was && worldEvent.type === "solar_flare") {
              try { SFX.flare(); } catch (e) {}
              pushKillFeed("SOLAR FLARE — ORE SURGE");
            }
          } else {
            worldEvent = null;
          }
        }

        if (payload.ship && payload.ship.id !== undefined) {
          const sId = Number(payload.ship.id);
          if (sId !== myId) {
            const s = payload.ship;
            const wx = Number(s.world_x);
            const wy = Number(s.world_y);
            if (Number.isFinite(wx) && Number.isFinite(wy)) {
              const incomingHp = Number.isFinite(Number(s.hp)) ? Number(s.hp) : 6;
              const incomingAlive = s.alive !== undefined ? Boolean(s.alive) : true;
              const incomingMax = Number.isFinite(Number(s.max_hp)) ? Number(s.max_hp) : 6;
              const prev = remoteShips[sId];
              // Trust authority HP, but if we optimistically lowered it and their packet is slightly stale,
              // keep the lower value briefly unless they clearly healed/respawned.
              let mergedHp = incomingHp;
              if (prev && prev.alive && incomingAlive && Number.isFinite(prev.hp)) {
                if (incomingHp < prev.hp) mergedHp = incomingHp; // confirmed damage
                else if (incomingHp > prev.hp + 0.5) {
                  // heal or respawn-related — accept
                  mergedHp = incomingHp;
                } else {
                  // same-ish HP; keep local (may be optimistic)
                  mergedHp = Math.min(prev.hp, incomingHp);
                }
              }
              if (prev && prev.alive && prev.hp > 0 && (mergedHp <= 0 || !incomingAlive)) {
                const victim = (prev.name || s.name || `PILOT ${sId}`);
                pushKillFeed(`${victim} HULL DESTROYED`);
                try { SFX.explode(); } catch (e) {}
              }
              // Exact local trail formula: behind ship at (pos - cos*S, pos + sin*S), ship color, life 1
              if (prev && Number.isFinite(prev.world_x) && incomingAlive && mergedHp > 0) {
                const dx = wx - prev.world_x, dy = wy - prev.world_y;
                const distSq = dx * dx + dy * dy;
                if (distSq > 1) {
                  // Use previous pose so exhaust sits where their engines were (matches own-screen trail)
                  const ang = Number.isFinite(prev.angle) ? prev.angle : (Number(s.angle) || 0);
                  const rad = (ang * Math.PI) / 180;
                  // Only show exhaust if they have an equipped trail (null = no trail)
                  const remoteTrail = (s.trail !== undefined ? s.trail : (prev && prev.trail)) || null;
                  const trailCol = remoteTrail ? trailColorFor(remoteTrail) : null;
                  if (trailCol) {
                    const steps = Math.min(4, Math.max(1, Math.floor(Math.sqrt(distSq) / 8)));
                    for (let s = 0; s < steps; s++) {
                      const t = (s + 1) / (steps + 1);
                      const px = prev.world_x + dx * t;
                      const py = prev.world_y + dy * t;
                      trails.push({
                        x: px - Math.cos(rad) * SHIP_SIZE,
                        y: py + Math.sin(rad) * SHIP_SIZE,
                        life: 1.0,
                        color: trailCol
                      });
                    }
                  }
                }
              }
              // If we just scored a kill on this pilot, ignore stale "still alive" packets briefly
              let lockUntil = (prev && prev._deadLockUntil) || 0;
              const creditT = recentKillCredit.get(Number(sId)) || 0;
              if (creditT) lockUntil = Math.max(lockUntil, creditT + KILL_CREDIT_LOCK_MS);
              if (lockUntil && performance.now() < lockUntil && (incomingAlive || mergedHp > 0)) {
                // Only allow revive after lock if they clearly respawned with invuln-style full hull mid-lock
                // Otherwise keep them dead so overlapping shots can't multi-kill
                if (!(incomingAlive && incomingHp >= incomingMax && mergedHp >= incomingMax)) {
                  incomingAlive = false;
                  mergedHp = 0;
                } else {
                  // legitimate respawn — clear lock
                  recentKillCredit.delete(Number(sId));
                  lockUntil = 0;
                }
              }
              remoteShips[sId] = {
                id: sId, 
                world_x: wx, 
                world_y: wy, 
                angle: Number.isFinite(Number(s.angle)) ? Number(s.angle) : 0, 
                hp: mergedHp, 
                max_hp: incomingMax,
                alive: incomingAlive, 
                xp: Number.isFinite(Number(s.xp)) ? Number(s.xp) : 0, 
                tier: Number.isFinite(Number(s.tier)) ? Number(s.tier) : tierFromXp(Number(s.xp) || 0),
                trail: s.trail !== undefined ? s.trail : (prev && prev.trail) || null,
                kills: Number.isFinite(Number(s.kills)) ? Number(s.kills) : (prev && prev.kills) || 0, 
                stasis: Boolean(s.stasis), 
                is_charging_shield: Boolean(s.is_charging_shield),
                shield_charge: Number.isFinite(Number(s.shield_charge)) ? Number(s.shield_charge) : 0,
                color: s.color || RAINBOW[Number(sId)] || RAINBOW[2],
                name: boardName(s.name || `PILOT ${sId}`),
                title: s.title || null,
                _deadLockUntil: lockUntil || 0
              };
            }
          }
        }

        // Combat hits: apply to self immediately; others get optimistic HP update
        const incomingHits = [];
        if (Array.isArray(payload.hits)) {
          for (const h of payload.hits) incomingHits.push(h);
        } else if (payload.hit_target !== undefined) {
          incomingHits.push({
            target: payload.hit_target,
            dmg: payload.dmg,
            stasis: payload.stasis_time
          });
        }
        for (const h of incomingHits) {
          const tid = Number(h.target);
          const dmg = Number(h.dmg) || 1;
          const st = h.stasis ? Number(h.stasis) : 0;
          if (tid === myId) {
            takeDamage(dmg);
            if (st > 0 && myShip && myShip.hp > 0) {
              myShip.stasis_timer = st || 1.5;
              myShip.is_charging_shield = false;
            }
          } else {
            applyDamageToRemote(tid, dmg, st);
          }
        }

        // Host applies damage reported by other players (their lasers may die before host simulates them)
        if (isHost() && Array.isArray(payload.asteroid_hits)) {
          for (const h of payload.asteroid_hits) {
            const hid = Number(h.id);
            const hdmg = Number(h.dmg) || 1;
            if (!Number.isFinite(hid)) continue;
            for (let ai = 0; ai < asteroids.length; ai++) {
              const a = asteroids[ai];
              if (Number(a.id) !== hid) continue;
              a.hp -= hdmg;
              if (a.hp <= 0) {
                spawnParticles(a.x, a.y, a.is_bomb ? 'rgb(255, 50, 50)' : ASTEROID_COLOR, 15);
                if (a.is_bomb) {
                  screenShake = 15;
                  for (const pid in remoteShips) {
                    const rp = remoteShips[pid];
                    if (rp && rp.alive && Math.hypot(rp.world_x - a.x, rp.world_y - a.y) < 200) queueHit(rp.id, 4);
                  }
                  if (myShip && myShip.alive && Math.hypot(myShip.world_x - a.x, myShip.world_y - a.y) < 200) takeDamage(4);
                }
                if (a.is_ore) spawnOreCluster(a.x, a.y, 4 + Math.floor(Math.random() * 4));
                else if (Math.random() < 0.25) spawnOreCluster(a.x, a.y, 2 + Math.floor(Math.random() * 3));
                Object.assign(a, createAsteroid(a.id));
              }
              worldSyncAccumulator = WORLD_SYNC_RATE; // push update ASAP
              break;
            }
          }
        }

        if (!isHost()) {
          if (Array.isArray(payload.asteroids) && payload.asteroids.length > 0) {
            pruneRecentCollected();
            asteroids = payload.asteroids.map(a => {
              const id = a.id;
              const maxHp = Number.isFinite(Number(a.max_hp)) ? Number(a.max_hp) : 4;
              let hp = Number.isFinite(Number(a.hp)) ? Number(a.hp) : maxHp;
              const rec = recentAsteroidHp.get(Number(id));
              if (rec) {
                // Host still lagging behind our damage — keep lower HP
                if (hp > rec.hp && rec.hp > 0 && hp < maxHp) {
                  hp = rec.hp;
                } else {
                  // Host caught up, or asteroid respawned at full HP — clear optimistic lock
                  recentAsteroidHp.delete(Number(id));
                }
              }
              return {
                id: id,
                x: Number.isFinite(Number(a.x)) ? Number(a.x) : 0,
                y: Number.isFinite(Number(a.y)) ? Number(a.y) : 0,
                vx: Number.isFinite(Number(a.vx)) ? Number(a.vx) : 0,
                vy: Number.isFinite(Number(a.vy)) ? Number(a.vy) : 0,
                r: Number.isFinite(Number(a.r)) ? Number(a.r) : 22,
                hp: hp,
                max_hp: maxHp,
                is_ore: Boolean(a.is_ore),
                is_bomb: Boolean(a.is_bomb)
              };
            });
          }
          if (Array.isArray(payload.ores)) {
            pruneRecentCollected();

    connectWs();

    let myShip = null; const remoteShips = {}; let lasers = []; let ores = []; let asteroids = [];

    function getTeam(playerId) {
      const id = Number(playerId) || 1;
      if (matchConfig.mode === "teams_3v3") return id <= 3 ? 0 : 1;
      if (matchConfig.mode === "teams_2v2v2") return Math.floor((id - 1) / 2);
      return -1; // FFA — no team
    }

    function sameTeam(a, b) {
      if (matchConfig.mode === "ffa") return Number(a) === Number(b);
      return getTeam(a) === getTeam(b);
    }

    function isTeamMode() {
      return matchConfig.mode === "teams_3v3" || matchConfig.mode === "teams_2v2v2";
    }

    function clampMatchConfig(cfg) {
      const c = Object.assign({}, matchConfig, cfg || {});
      c.mode = ["ffa", "teams_3v3", "teams_2v2v2"].includes(c.mode) ? c.mode : "ffa";
      c.useTimer = Boolean(c.useTimer);
      c.useKills = Boolean(c.useKills);
      if (!c.useTimer && !c.useKills) c.useTimer = true; // must end somehow
      c.durationSec = Math.max(60, Math.min(MATCH_TIME_MAX_SEC, Number(c.durationSec) || 480));
      let kl = Number(c.killLimit);
      if (!Number.isFinite(kl) || kl < 0) kl = 0;
      c.killLimit = Math.floor(kl); // 0 = unlimited
      let fee = Number(c.entryFee);
      if (!Number.isFinite(fee) || fee < 0) fee = 0;
      const FEE_OPTS = [0, 50, 100, 250, 500];
      c.entryFee = FEE_OPTS.includes(fee) ? fee : 0;
      return c;
    }

    function applyMatchConfig(cfg) {
      matchConfig = clampMatchConfig(cfg);
      matchTimeLeft = matchConfig.useTimer ? matchConfig.durationSec : 999999;

    function resetMatch() {
      matchConfig = clampMatchConfig(matchConfig);
      matchTimeLeft = matchConfig.useTimer ? matchConfig.durationSec : 999999;

    function getMatchStandings() {
      if (isTeamMode()) {
        const teams = {};
        const add = (id, name, kills) => {
          const t = getTeam(id);
          if (!teams[t]) teams[t] = { team: t, name: TEAM_NAMES[t] || `TEAM ${t}`, kills: 0, members: [] };
          teams[t].kills += kills || 0;
          teams[t].members.push({ name, kills: kills || 0, id });
        };
        add(myId, (myShip && myShip.name) || "YOU", (myShip && myShip.kills) || 0);
        for (const pid in remoteShips) {
          const p = remoteShips[pid];
          if (!p) continue;
          add(Number(pid), p.name || `PILOT ${pid}`, p.kills || 0);
        }
        return Object.values(teams).sort((a, b) => b.kills - a.kills);
      }
      const list = [{ name: boardName((myShip && myShip.name) || "YOU"), kills: (myShip && myShip.kills) || 0, id: myId }];
      for (const pid in remoteShips) {
        const p = remoteShips[pid];
        if (!p) continue;
        list.push({ name: boardName(p.name || `PILOT ${pid}`), kills: p.kills || 0, id: Number(pid) });
      }
      list.sort((a, b) => b.kills - a.kills || a.name.localeCompare(b.name));
      return list;
    }

    function finishMatch(reason) {
      if (matchOver) return;
      matchOver = true;
      try { SFX.matchEnd(); } catch (e) {}
      matchResults = getMatchStandings();

        matchWinnerName = matchResults.length ? (matchResults[0].name + " TEAM") : "NOBODY";

      statusMessage = reason || "Match complete.";

        // simpler win check
        let won = false;
        if (!isTeamMode() && matchResults[0] && Number(matchResults[0].id) === Number(myId)) won = true;

          won = matchResults[0].members.some(m => Number(m.id) === Number(myId));

        // Earned color blueprint drop for winning (must have been in the match 60s+)
        if (won && (matchStats.timeAlive || 0) >= 60) {
          const bpMsg = tryEarnColorBlueprint(COLOR_BP_DROP_WIN);

        }
        // Wager payout: winner takes entryFee * playerCount
        const fee = matchConfig.entryFee || 0;
        if (won && fee > 0 && matchWagerPaid) {

    let netAccumulator = 0; const NET_TICK_RATE = 0.025; // 40 Hz for snappier HP / combat sync

    function applyDamageToRemote(targetId, dmg, stasisTime, creditKill) {
      const id = Number(targetId);
      const rp = remoteShips[id];
      if (!rp) return;
      const amount = Number(dmg) || 1;
      const wasAlive = rp.alive !== false && (Number.isFinite(rp.hp) ? rp.hp : 6) > 0;
      rp.hp = Math.max(0, (Number.isFinite(rp.hp) ? rp.hp : 6) - amount);
      if (cpuShips[id]) {
        cpuShips[id].hp = rp.hp;

    const keysDown = {}; let mousePos = { x: 0, y: 0 }; let fireKeyWasDown = false; let eKeyWasDown = false;

    function handleMenuClick(pos) {
      if (!inLobby) return;
      const cx = V_WIDTH / 2;

      if (menuMode === "connecting") {
        if (connectionError && pos.x >= cx - 110 && pos.x <= cx + 110 && pos.y >= 430 && pos.y <= 478) {
          connectWs();
        }
      } else if (menuMode === "account") {
        // Tab buttons

        if (pos.x >= cx - 140 && pos.x <= cx + 140) {
          if (pos.y >= 185 && pos.y <= 223) {
            authActiveField = "name";
            openMobileKeyboard("authName");
          }

            openMobileKeyboard("authDisplay");
          }
          const passY0 = authTab === "register" ? 305 : 245;
          if (pos.y >= passY0 && pos.y <= passY0 + 38) {
            authActiveField = "pass";
            openMobileKeyboard("authPass");
          }
        }
        // Action Button (aligned with renderLobby account panel)
        const actY = authTab === "register" ? 372 : 312;
        if (pos.x >= cx - 140 && pos.x <= cx + 140 && pos.y >= actY && pos.y <= actY + 48) {
          closeMobileKeyboard();
          if (authBusy) return;
          const u = normalizeHandle(authNameInput);
          const d = (authDisplayInput.trim() || u);
          const p = authPassInput;

          if (u.length < 3) {
            authMessage = "USERNAME MUST BE 3+ CHARS";
            return;
          }
          if (!/^[a-z0-9_]+$/.test(u)) {
            authMessage = "USERNAME: A-Z, 0-9, UNDERSCORE ONLY";
            return;
          }
          if (p.length < 6) {
            authMessage = "PASSWORD MUST BE 6+ CHARS";
            return;
          }
          if (!sb) {
            authMessage = "AUTH UNAVAILABLE — RELOAD PAGE";
            return;
          }

          authBusy = true;
          authMessage = authTab === "register" ? "CREATING ACCOUNT..." : "SIGNING IN...";

          (async () => {
            try {
              const email = usernameToEmail(u);
              if (authTab === "register") {
                const { data, error } = await sb.auth.signUp({
                  email,
                  password: p,
                  options: {
                    data: {
                      handle: u,
                      display_name: d.slice(0, 20)
                    }
                  }
                });
                if (error) {
                  authMessage = (error.message || "SIGN UP FAILED").toUpperCase().slice(0, 48);
                  authBusy = false;
                  return;
                }
                // Wait briefly for profile trigger, then load
                let pilot = null;
                if (data.user) {
                  await new Promise(r => setTimeout(r, 400));
                  pilot = await loadProfileForUser(data.user);
                }
                if (!pilot) {
                  pilot = {
                    id: data.user && data.user.id,
                    username: u,
                    display_name: d.slice(0, 20),
                    handle: u,
                    career_xp: 0, kills: 0, asteroids: 0, highest_tier: 0
                  };
                }
                const accs = getAccounts();
                if (!accs[u]) {
                  accs[u] = { username: u, career_xp: 0, kills: 0, asteroids: 0, highest_tier: 0 };
                  saveAccounts(accs);
                }
                activePilot = { ...accs[u], ...pilot, username: u, display_name: pilot.display_name || d };
                sessionStorage.setItem("astraclash_current_user", JSON.stringify(activePilot));
                initMyShip();
                menuMode = "main";
                statusMessage = `Welcome to AstraClash, ${activePilot.display_name}.`;
                reloadShopForPilot();
                reloadContracts();
                refreshCoins();
                statusColor = CYAN;
              } else {
                const { data, error } = await sb.auth.signInWithPassword({
                  email,
                  password: p
                });
                if (error) {
                  authMessage = (error.message || "LOGIN FAILED").toUpperCase().slice(0, 48);
                  authBusy = false;
                  return;
                }
                const pilot = await loadProfileForUser(data.user);
                const accs = getAccounts();
                const local = accs[u] || { username: u, career_xp: 0, kills: 0, asteroids: 0, highest_tier: 0 };
                if (!accs[u]) { accs[u] = local; saveAccounts(accs); }
                activePilot = {
                  ...local,
                  id: pilot.id,
                  username: pilot.username || u,
                  display_name: pilot.display_name || u,
                  handle: pilot.handle || u,
                  coins: pilot.coins || 0
                };
                sessionStorage.setItem("astraclash_current_user", JSON.stringify(activePilot));
                initMyShip();
                menuMode = "main";
                statusMessage = `Welcome back, ${activePilot.display_name}.`;
                reloadShopForPilot();
                reloadContracts();
                refreshCoins();
                statusColor = CYAN;
              }

      } else if (menuMode === "main") {

      } else if (menuMode === "private") {

        } else if (pos.x >= cx - 160 && pos.x <= cx + 160 && pos.y >= 295 && pos.y <= 353) {

      } else if (menuMode === "settings") {

      } else if (menuMode === "shop") {

        } else {

        if (shopBusy) { /* ignore */ }
        else if (shopTab === "boosts") {
          const items = SHOP_CONSUMABLES;
          for (let i = 0; i < items.length; i++) {

                }

        } else if (shopTab === "trails") {

        } else if (shopTab === "titles") {

    function bindTouch(id, keyName, isPressEvent = false) {

    // Virtual joystick → W (thrust) / A D (turn)
    (function setupJoystick() {
      const base = document.getElementById("joy-base");
      const stick = document.getElementById("joy-stick");
      if (!base || !stick) return;
      const maxR = 38;
      let activeId = null;

      function setKeys(nx, ny) {
        // ny negative = stick up = thrust
        keysDown["KeyW"] = ny < -0.25;
        keysDown["ArrowUp"] = keysDown["KeyW"];
        keysDown["KeyA"] = nx < -0.28;
        keysDown["ArrowLeft"] = keysDown["KeyA"];
        keysDown["KeyD"] = nx > 0.28;
        keysDown["ArrowRight"] = keysDown["KeyD"];
      }

      function resetStick() {
        stick.style.transform = "translate(-50%, -50%)";
        setKeys(0, 0);
        keysDown["KeyW"] = keysDown["ArrowUp"] = false;
        keysDown["KeyA"] = keysDown["ArrowLeft"] = false;
        keysDown["KeyD"] = keysDown["ArrowRight"] = false;
        activeId = null;
      }

      function moveTo(clientX, clientY) {
        const rect = base.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const len = Math.hypot(dx, dy) || 1;
        if (len > maxR) {
          dx = (dx / len) * maxR;
          dy = (dy / len) * maxR;
        }
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        setKeys(dx / maxR, dy / maxR);
      }

      base.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        moveTo(t.clientX, t.clientY);
      }, { passive: false });

      base.addEventListener("touchmove", (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.identifier === activeId) moveTo(t.clientX, t.clientY);
        }
      }, { passive: false });

      const end = (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === activeId) resetStick();
        }
      };
      base.addEventListener("touchend", end, { passive: false });
      base.addEventListener("touchcancel", end, { passive: false });

      // Mouse fallback for desktop testing
      let mouseDrag = false;
      base.addEventListener("mousedown", (e) => {
        e.preventDefault();
        mouseDrag = true;
        moveTo(e.clientX, e.clientY);
      });
      window.addEventListener("mousemove", (e) => {
        if (mouseDrag) moveTo(e.clientX, e.clientY);
      });
      window.addEventListener("mouseup", () => {
        if (mouseDrag) { mouseDrag = false; resetStick(); }
      });
    })();

    let stepAccumulator = 0;

      lastTime = now;

        if (inLobby) {

        } else { 
          stepAccumulator += dt;
          let steps = 0;
          while (stepAccumulator >= FIXED_STEP && steps < 5) {
            updateGame(FIXED_STEP);
            stepAccumulator -= FIXED_STEP;
            steps++;
          }
          if (steps >= 5) stepAccumulator = 0; // too far behind, drop the backlog
          renderGame(); 
        } 
      } catch (err) { 
        console.error("GameLoop safety rescue:", err); 
      }

    function drawDirectShip(targetCtx, x, y, angle, color, isDead = false) {
      const rad = (angle * Math.PI) / 180;
      const size = SHIP_SIZE;
      
      const tx = x + size * Math.cos(rad);
      const ty = y - size * Math.sin(rad);
      const lx = x + size * 0.75 * Math.cos(rad + (140 * Math.PI) / 180);
      const ly = y - size * 0.75 * Math.sin(rad + (140 * Math.PI) / 180);
      const rx = x + size * 0.75 * Math.cos(rad - (140 * Math.PI) / 180);
      const ry = y - size * 0.75 * Math.sin(rad - (140 * Math.PI) / 180);

      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.moveTo(tx, ty);
      targetCtx.lineTo(lx, ly);
      targetCtx.lineTo(rx, ry);
      targetCtx.closePath();

      if (isDead) {
        targetCtx.globalAlpha = 0.35 + Math.sin(performance.now() / 100) * 0.2;
        targetCtx.strokeStyle = "rgb(255, 60, 60)";
        targetCtx.fillStyle = "rgba(255, 60, 60, 0.2)";
      } else {
        targetCtx.strokeStyle = color || CYAN;
        targetCtx.fillStyle = "rgba(15, 25, 45, 0.85)";
      }

      targetCtx.lineWidth = 3;
      targetCtx.fill();
      targetCtx.stroke();
      targetCtx.restore();
    }

    function updateGame(dt) {
      if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 40);
      if (!Number.isFinite(screenShake)) screenShake = 0;

      // Match clock (host drives; others follow packets)
      if (!matchOver) {
        const playerCount = 1 + Object.keys(remoteShips).length; // includes host-synced CPUs
        const matchActive = playerCount >= 2;
        if (isHost()) {
          // Solar flare event
          if (matchActive) {
            if (worldEvent) {
              worldEvent.timeLeft -= dt;
              if (worldEvent.timeLeft <= 0) worldEvent = null;
            } else {
              worldEventCooldown -= dt;
              if (worldEventCooldown <= 0) {
                worldEvent = { type: "solar_flare", timeLeft: 10, duration: 10 };
                worldEventCooldown = 55 + Math.random() * 40;
                try { SFX.flare(); } catch (e) {}
                pushKillFeed("SOLAR FLARE — ORE SURGE");
              }
            }
          }
          if (matchActive && matchConfig.useTimer) {
            matchTimeLeft = Math.max(0, matchTimeLeft - dt);
          }
          const standings = getMatchStandings();
          const topKills = standings.length ? standings[0].kills : 0;
          if (matchActive && matchConfig.useKills && matchConfig.killLimit > 0 && topKills >= matchConfig.killLimit) {
            const label = isTeamMode() ? (standings[0].name + " TEAM") : standings[0].name;
            finishMatch(`${label} reached ${matchConfig.killLimit} kills!`);
          } else if (matchActive && matchConfig.useTimer && matchTimeLeft <= 0) {
            finishMatch("Time limit reached!");
          }
        }
        // Non-host: tick local event timer for VFX if host sent it
        if (!isHost() && worldEvent) {
          worldEvent.timeLeft -= dt;
          if (worldEvent.timeLeft <= 0) worldEvent = null;
        }
      } else {
        // Frozen combat — results screen is closed with the X button only (no key skip)
        // Skip the rest of simulation while results show
        netAccumulator += dt;
        if (netAccumulator >= NET_TICK_RATE) {
          netAccumulator = 0;
          if (myShip && isHost()) {
            sendMsg({
              action: "game_packet",
              payload: {
                ship: {
                  id: myShip.id,
                  world_x: Number(myShip.world_x.toFixed(1)),
                  world_y: Number(myShip.world_y.toFixed(1)),
                  angle: Math.round(myShip.angle),
                  hp: myShip.hp,
                  max_hp: myShip.max_hp,
                  alive: myShip.alive,
                  xp: myShip.xp,
                  kills: myShip.kills || 0,
                  stasis: false,
                  name: boardName(myShip.name),
                  title: myShip.title || null,
                  trail: (shopData && shopData.activeTrail) ? shopData.activeTrail : null
                },
                match_config: matchConfig,
                match_time: matchTimeLeft,
                match_over: true,
                match_reason: statusMessage
              }
            });
          }
        }
        return;
      }

      // Keep scanning for real Quick Play lobbies while searching or practicing
      if (quickPlaySearch && isConnected && (practiceMode || menuMode === "finding" || (menuMode === "waiting" && lobbyIsPublic))) {
        const now = performance.now();
        if (now - lastPublicPollAt > 4000) {
          lastPublicPollAt = now;
          sendMsg({ action: "list_public" });
        }
      }
      if (!inLobby && isHost()) {
        updateCpuShips(dt);
        for (const id of Object.keys(cpuShips)) {
          const c = cpuShips[id];
          if (c) remoteShips[c.id] = c;
        }
      }
      if (lasers.length > 80) lasers.splice(0, lasers.length - 80);
      if (particles.length > 120) particles.splice(0, particles.length - 120);
      
      if (myShip) {
        if (myShip.stasis_timer > 0) myShip.stasis_timer -= dt;
        if (!Number.isFinite(myShip.world_x)) myShip.world_x = 0;
        if (!Number.isFinite(myShip.world_y)) myShip.world_y = 0;
        if (!Number.isFinite(myShip.vx)) myShip.vx = 0;
        if (!Number.isFinite(myShip.vy)) myShip.vy = 0;
        if (!Number.isFinite(myShip.angle)) myShip.angle = 0;
      }

      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
      for (let i = trails.length - 1; i >= 0; i--) { trails[i].life -= dt * 2.0; if (trails[i].life <= 0) trails.splice(i, 1); }

      if (myShip && !myShip.alive) {
        myShip.respawn_timer -= dt; myShip.vx = 0; myShip.vy = 0;
        if (myShip.respawn_timer <= 0) {
          myShip.alive = true; myShip.hp = myShip.max_hp;
          myShip.world_x = Number((-WORLD_BOUND * 0.4 + Math.random() * (WORLD_BOUND * 0.8)).toFixed(1)); 
          myShip.world_y = Number((-WORLD_BOUND * 0.4 + Math.random() * (WORLD_BOUND * 0.8)).toFixed(1)); 
          myShip.vx = 0.0; myShip.vy = 0.0; myShip.mana = 25.0; myShip.respawn_timer = 0;
          myShip.invuln_timer = 15; // max 15s; firing ends it early
        }
      }
      for (let i = killFeed.length - 1; i >= 0; i--) {
        killFeed[i].life -= dt;
        if (killFeed[i].life <= 0) killFeed.splice(i, 1);
      }
      // Floating damage numbers
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const f = floatTexts[i];
        f.life -= dt;
        f.y += f.vy * dt;
        f.vy *= 0.98;
        if (f.life <= 0) floatTexts.splice(i, 1);
      }
      // Survival clock (alive time in active multiplayer match)
      if (!matchOver && myShip && myShip.alive && myShip.hp > 0 && (1 + Object.keys(remoteShips).length) >= 2) {
        matchStats.timeAlive += dt;
      }

      if (myShip && myShip.cooldown > 0) myShip.cooldown -= dt;
      if (myShip && myShip.dash_cooldown > 0) myShip.dash_cooldown -= dt;
      if (myShip && myShip.alive && (myShip.invuln_timer || 0) > 0) {
        myShip.invuln_timer = Math.max(0, myShip.invuln_timer - dt);
      }

      function emitShot(angDeg, offsetFwd, offsetSide, customLife = null, isMine = false) {
        if (!myShip || !myShip.alive) return false;
        let isMis = isMine ? false : Boolean(myShip.is_missile);
