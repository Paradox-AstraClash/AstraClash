<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AstraClash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: Consolas, monospace; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #gameCanvas { background-color: rgb(10, 10, 25); image-rendering: pixelated; cursor: pointer; }
    .touch-ui { position: fixed; z-index: 99; pointer-events: auto; display: none; }
    /* Virtual joystick — left side */
    .joy-wrap {
      bottom: 28px; left: 18px;
      width: 130px; height: 130px;
      touch-action: none;
    }
    .joy-base {
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(15, 22, 40, 0.55);
      border: 2px solid rgba(0, 255, 255, 0.45);
      position: relative;
    }
    .joy-stick {
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(0, 255, 255, 0.35);
      border: 2px solid #00ffff;
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }
    /* Right action cluster: ability center, fire below */
    .action-pad {
      bottom: 100px; right: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .upgrade-pad { top: 70px; right: 20px; display: flex; gap: 10px; }
    .t-btn {
      background: rgba(20, 30, 50, 0.8);
      border: 2px solid #00ffff;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .t-btn:active, .t-btn.active { background: rgba(0, 255, 255, 0.4); }
    #btn-ability {
      width: 64px; height: 64px; border-radius: 50%;
      font-size: 13px;
    }
    #btn-fire {
      width: 78px; height: 78px; border-radius: 50%;
      border-color: #ff3c3c;
      background: rgba(60, 20, 25, 0.85);
      font-size: 15px;
    }
    #btn-fire:active, #btn-fire.active {
      background: rgba(255, 60, 60, 0.45);
    }
    /* Real input so mobile OS keyboards can open (canvas key events do not) */
    #mobileTextInput {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(90vw, 320px);
      height: 44px;
      z-index: 200;
      font-size: 16px; /* prevents iOS zoom on focus */
      font-family: Consolas, monospace;
      text-align: center;
      color: #fff;
      background: rgba(15, 18, 32, 0.95);
      border: 2px solid #00ffff;
      border-radius: 8px;
      outline: none;
      padding: 8px 12px;
      display: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    #mobileTextInput.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <input id="mobileTextInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" />

  <!-- Virtual joystick (move / turn) -->
  <div class="touch-ui joy-wrap" id="group-dpad">
    <div class="joy-base" id="joy-base">
      <div class="joy-stick" id="joy-stick"></div>
    </div>
  </div>

  <!-- Ability above fire (fire sits lower like a d-pad "down") -->
  <div class="touch-ui action-pad" id="group-action">
    <div class="t-btn" id="btn-ability">ABIL</div>
    <div class="t-btn" id="btn-fire">FIRE</div>
  </div>

  <div class="touch-ui upgrade-pad" id="group-upgrade">
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-1">1</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-2">2</div>
    <div class="t-btn" style="width: 42px; height: 42px;" id="btn-3">3</div>
  </div>

  <script>
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia("(pointer: coarse)").matches;
    const mobileInput = document.getElementById("mobileTextInput");
    let mobileField = null; // 'authName' | 'authPass' | 'roomCode' | 'roomPass'

    function syncMobileFieldFromInput() {
      if (!mobileInput || !mobileField) return;
      let v = mobileInput.value || "";
      if (mobileField === "authName") {
        v = v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        authNameInput = v;
        if (mobileInput.value !== v) mobileInput.value = v;
      } else if (mobileField === "authPass") {
        v = v.slice(0, 12);
        authPassInput = v;
      } else if (mobileField === "roomCode") {
        v = v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
        roomCodeInput = v;
        if (mobileInput.value !== v) mobileInput.value = v;
      } else if (mobileField === "roomPass") {
        v = v.slice(0, 16);
        passwordInput = v;
      }
    }

    function openMobileKeyboard(field) {
      if (!mobileInput) return;
      mobileField = field;
      let val = "";
      let placeholder = "Type here";
      let inputMode = "text";
      let type = "text";
      if (field === "authName") {
        val = authNameInput;
        placeholder = "CALLSIGN";
        mobileInput.setAttribute("autocapitalize", "characters");
        authActiveField = "name";
      } else if (field === "authPass") {
        val = authPassInput;
        placeholder = "PASS-KEY";
        type = "password";
        authActiveField = "pass";
      } else if (field === "roomCode") {
        val = roomCodeInput;
        placeholder = "4-LETTER CODE";
        mobileInput.setAttribute("autocapitalize", "characters");
        activeInput = "code";
      } else if (field === "roomPass") {
        val = passwordInput;
        placeholder = "PASSWORD (optional)";
        type = "text";
        activeInput = "pass";
      }
      mobileInput.type = type === "password" ? "password" : "text";
      mobileInput.placeholder = placeholder;
      mobileInput.value = val;
      mobileInput.classList.add("visible");
      // Focus must run inside the user gesture for iOS
      setTimeout(() => {
        try {
          mobileInput.focus({ preventScroll: true });
          mobileInput.click();
        } catch (e) {
          try { mobileInput.focus(); } catch (e2) {}
        }
      }, 10);
    }

    function closeMobileKeyboard() {
      if (!mobileInput) return;
      syncMobileFieldFromInput();
      mobileField = null;
      mobileInput.blur();
      mobileInput.classList.remove("visible");
      mobileInput.value = "";
    }

    if (mobileInput) {
      mobileInput.addEventListener("input", () => syncMobileFieldFromInput());
      mobileInput.addEventListener("change", () => syncMobileFieldFromInput());
      mobileInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          syncMobileFieldFromInput();
          closeMobileKeyboard();
        }
      });
      // Keep game vars live while typing
      mobileInput.addEventListener("keyup", () => syncMobileFieldFromInput());
    }

    function updateTouchUIVisibility() {
      const showTouch = isTouchDevice && !inLobby;
      document.getElementById("group-dpad").style.display = showTouch ? "block" : "none";
      document.getElementById("group-action").style.display = showTouch ? "flex" : "none";
      document.getElementById("group-upgrade").style.display = showTouch ? "flex" : "none";
    }

    const V_WIDTH = 1000; const V_HEIGHT = 600;
    const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
    const virtualCanvas = document.createElement("canvas"); virtualCanvas.width = V_WIDTH; virtualCanvas.height = V_HEIGHT;
    const vctx = virtualCanvas.getContext("2d");

    let canvasScale = 1; let screenShake = 0; const particles = []; const trails = [];

    function resizeWindow() {
      const winW = window.innerWidth || 1000; const winH = window.innerHeight || 600;
      canvasScale = Math.min(winW / V_WIDTH, winH / V_HEIGHT);
      canvas.width = Math.floor(V_WIDTH * canvasScale); canvas.height = Math.floor(V_HEIGHT * canvasScale);
    }
    window.addEventListener("resize", resizeWindow); resizeWindow();

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: (clientX - rect.left) / canvasScale, y: (clientY - rect.top) / canvasScale };
    }

    const RAINBOW = { 1: "rgb(255, 60, 60)", 2: "rgb(255, 140, 30)", 3: "rgb(255, 220, 50)", 4: "rgb(50, 255, 80)", 5: "rgb(30, 140, 255)", 6: "rgb(190, 70, 255)" };
    const BLACK = "rgb(10, 10, 25)"; const WHITE = "rgb(255, 255, 255)"; const CYAN = "rgb(0, 255, 255)"; const GRAY = "rgb(140, 140, 150)";
    const DARK_GRAY = "rgb(45, 50, 65)"; const XP_BG = "rgb(20, 30, 50)"; const XP_BLUE = "rgb(0, 180, 255)"; const ORE_GOLD = "rgb(255, 215, 0)";
    const ASTEROID_COLOR = "rgb(115, 110, 125)"; const ORE_ASTEROID_COLOR = "rgb(70, 95, 130)"; const BOMB_ASTEROID_COLOR = "rgb(200, 50, 50)"; const ORE_BLUE = "rgb(0, 180, 255)";
    const PANEL_BG = "rgb(15, 18, 32)"; const BORDER_COLOR = "rgb(0, 180, 255)";

    const BASE_MOVE_SPEED = 5.0; const BASE_ROT_SPEED = 4.0; const WORLD_BOUND = 2000; const ASTEROID_COUNT = 30; const SHIP_SIZE = 20;

    const UPGRADE_TREE = {
      root: { children: ["twin_cannons", "heavy_armor", "tractor_core"] },
      twin_cannons: { name: "Twin Cannons", desc: "Fire 2 parallel lasers", children: ["rapid_fire", "railgun"], apply: (p) => { p.cannons = 2; } },
      rapid_fire: { name: "Gatling Laser", desc: "Hold to fire · twice the fire rate", children: ["spread_burst", "homing_blasts"], apply: (p) => { p.cooldown_max = 0.11; p.hold_fire = true; } },
      spread_burst: { name: "Spread Burst", desc: "Fires a 3-way laser shotgun spread", children: ["rear_cannon", "heavy_slugs"], apply: (p) => { p.spread_shot = true; } },
      heavy_slugs: { name: "High-Caliber Slugs", desc: "Shots deal heavy impact damage", children: ["hyper_homing"], apply: (p) => { p.shot_damage = 2; } },
      railgun: { name: "Piercing Beam", desc: "Lasers punch through asteroids", children: ["prism_splitter", "heavy_slugs"], apply: (p) => { p.piercing = true; } },
      rear_cannon: { name: "Rear Defense", desc: "Fires an extra laser backwards", children: ["upgraded_body"], apply: (p) => { p.rear_cannon = true; } },
      prism_splitter: { name: "Prism Splitter", desc: "Lasers deal bonus damage", children: ["super_prism"], apply: (p) => { p.shot_damage = 2; } },
      homing_blasts: { name: "Hunter Torpedoes", desc: "Fires seeking missile torpedoes (1 dmg)", children: ["hyper_homing"], apply: (p) => { p.laser_speed = 12.0; p.is_missile = true; p.shot_damage = 1; } },
      hyper_homing: { name: "Predator Swarm", desc: "Faster missiles, still 1 dmg each", children: ["vampire_core", "boomerang_beams"], apply: (p) => { p.shot_damage = 1; p.is_missile = true; p.laser_speed = 14.0; p.cooldown_max = Math.min(p.cooldown_max, 0.14); } },
      super_prism: { name: "Refraction Field", desc: "Split lasers pierce and shred", children: ["tachyon_lance", "targeting_optics"], apply: (p) => { p.piercing = true; p.shot_damage = 3; } },
      heavy_armor: { name: "Heavy Plating", desc: "Max HP boosted to 12", children: ["battering_ram", "afterburners"], apply: (p) => { p.max_hp = 12; p.hp = 12; } },
      battering_ram: { name: "Battering Ram", desc: "Heavy shove on asteroid contact", children: ["reactive_hull", "upgraded_body"], apply: (p) => { p.ram_power = 3.8; } },
      reactive_hull: { name: "Reactive Armor", desc: "Max HP boosted to 14", children: ["reinforced_bulkheads"], apply: (p) => { p.max_hp = 14; p.hp = 14; } },
      reinforced_bulkheads: { name: "Reinforced Bulkheads", desc: "Boosts hull durability to 18 HP", children: ["barrier_blast"], apply: (p) => { p.max_hp = 18; p.hp = 18; } },
      afterburners: { name: "Afterburners", desc: "Speed boosted by +40%", children: ["ion_wake", "upgraded_body"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.4; } },
      ion_wake: { name: "Ion Wake", desc: "Further boosts engine speed by +20%", children: ["plasma_overdrive"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.6; } },
      upgraded_body: { name: "Upgraded Body", desc: "Increases max HP and armor", children: ["titan_body"], apply: (p) => { p.max_hp += 2; p.hp += 2; } },
      barrier_blast: { name: "Aegis Overload", desc: "Titan hull upgraded to 22 HP", children: ["nanite_scavenger", "stasis_field"], apply: (p) => { p.max_hp = 22; p.hp = 22; } },
      plasma_overdrive: { name: "Plasma Tempest", desc: "Speed boosted by +80%", children: ["phase_dash", "flak_shotgun"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.8; } },
      titan_body: { name: "Titan Body", desc: "Max HP boosted by +6", children: ["proximity_mines", "stasis_field"], apply: (p) => { p.max_hp += 6; p.hp += 6; } },
      tractor_core: { name: "Tractor Core", desc: "3x magnet range & faster collection", children: ["ore_transmuter", "slingshot_tether"], apply: (p) => { p.magnet_range = 350; p.orb_accel = 0.18; } },
      ore_transmuter: { name: "Ore Transmuter", desc: "+50% XP from all blue ores", children: ["ore_siphon", "upgraded_body"], apply: (p) => { p.xp_mult = 1.5; } },
      ore_siphon: { name: "Ore Siphon", desc: "Ores yield +100% more Ore Mana", children: ["auxiliary_battery"], apply: (p) => { p.mana_mult = 2.0; } },
      auxiliary_battery: { name: "Auxiliary Battery", desc: "Increases max Ore Mana by +60", children: ["singularity_core"], apply: (p) => { p.max_mana = 160.0; p.mana += 60.0; } },
      slingshot_tether: { name: "Slingshot Core", desc: "Turning agility doubled", children: ["gravity_repulsor"], apply: (p) => { p.rot_speed = BASE_ROT_SPEED * 1.8; } },
      gravity_repulsor: { name: "Gravity Repulsor", desc: "+30% thrust speed", children: ["singularity_core"], apply: (p) => { p.move_speed = BASE_MOVE_SPEED * 1.3; } },
      singularity_core: { name: "Singularity Core", desc: "Massive screen-wide magnet range", children: ["stasis_field", "phase_dash"], apply: (p) => { p.magnet_range = 800; p.orb_accel = 0.28; p.move_speed = BASE_MOVE_SPEED * 1.5; } },
      nanite_scavenger: { name: "Nanite Scavenger", desc: "Collecting 5 Ores heals 1 HP", children: [], apply: (p) => { p.heal_on_ore = true; } },
      vampire_core: { name: "Vampire Core", desc: "Hitting enemies siphons and heals HP", children: [], apply: (p) => { p.life_leech = true; } },
      tachyon_lance: { name: "Tachyon Lance", desc: "Slow but massive piercing sniper shot", children: [], apply: (p) => { p.laser_speed = 35.0; p.shot_damage = 5; p.cooldown_max = 0.85; p.piercing = true; } },
      targeting_optics: { name: "Targeting Optics", desc: "Enemy markers reveal live Health Bars", children: [], apply: (p) => { p.targeting_optics = true; } },
      stasis_field: { name: "Stasis Forcefield", desc: "E raises a free shield bubble; E again launches it", children: [], apply: (p) => { p.has_stasis_field = true; } },
      phase_dash: { name: "Phase Dash", desc: "Press ABILITY (E) to warp using 40 Mana", children: [], apply: (p) => { p.can_dash = true; } },
      proximity_mines: { name: "Proximity Mines", desc: "Automatically drop red explosive mines", children: [], apply: (p) => { p.drops_mines = true; } },
      boomerang_beams: { name: "Boomerang Beams", desc: "Lasers stop and reverse direction back to you", children: [], apply: (p) => { p.boomerang = true; } },
      flak_shotgun: { name: "Flak Shotgun", desc: "Massive spread of short-range shrapnel", children: [], apply: (p) => { p.flak_mode = true; p.cooldown_max = 0.6; p.shot_damage = 2; p.laser_speed = 18.0; } }
    };

    const TIER_XP_THRESHOLDS = [0, 300, 800, 1600, 3000, 5000];
    const BOOT_TIPS = [
      "Blue ore fuels upgrades. Gold ore fully restores hull and mana.",
      "Gatling Laser is the only weapon that lets you hold fire.",
      "Missiles deal 1 damage but home onto targets you can see.",
      "Private rooms can run FFA, 3v3, or 2v2v2 with custom limits.",
      "First to the kill limit — or survive until the timer hits zero.",
      "Press E to raise a Stasis field. Press E again to launch it.",
      "A full force field protects for free. Growing it still costs mana.",
      "Off-screen rivals show as directional arrows on the edge.",
      "Asteroid bombs detonate hard. Stay clear of the blast radius.",
      "Tier 5 is max. After that, your top bar becomes pure mana.",
      "Twin Cannons and Spread Burst multiply your shot count.",
      "Phase Dash burns mana to blink forward — great for escapes.",
      "Same callsign is allowed. Your career stats stay on this device.",
      "Host leaves? World authority can desync — rejoin a fresh room.",
      "Ore magnets pull harder with Tractor and Singularity upgrades.",
      "Team modes disable friendly fire. Don't shoot your color.",
      "Hull is small. Movement and angle win more fights than raw DPS.",
      "Private match timer max is 20 minutes. Kill limit 0 means unlimited."
    ];

    // --- Lightweight Web Audio SFX (no external files) ---
    let audioCtx = null;
    let sfxMuted = false;
    function ensureAudio() {
      if (sfxMuted) return null;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      } catch (e) { return null; }
    }
    function playTone(freq, dur, type, vol, slideTo) {
      const ctx = ensureAudio(); if (!ctx) return;
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(vol || 0.06, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    const SFX = {
      shoot() { playTone(420, 0.06, "square", 0.04, 180); },
      hit() { playTone(160, 0.1, "sawtooth", 0.07, 60); },
      explode() { playTone(90, 0.35, "sawtooth", 0.1, 30); playTone(50, 0.4, "triangle", 0.06, 20); },
      ore() { playTone(660, 0.08, "sine", 0.05, 990); },
      upgrade() { playTone(520, 0.08, "triangle", 0.06); setTimeout(() => playTone(780, 0.12, "triangle", 0.06), 70); },
      matchEnd() { playTone(330, 0.15, "triangle", 0.07); setTimeout(() => playTone(440, 0.2, "triangle", 0.07), 120); setTimeout(() => playTone(550, 0.35, "triangle", 0.08), 260); },
      dash() { playTone(200, 0.15, "sine", 0.05, 80); },
      shield() { playTone(300, 0.12, "sine", 0.04, 500); },
      flare() { playTone(100, 0.5, "sawtooth", 0.08, 40); }
    };
    // Unlock audio on first user gesture
    ["pointerdown", "keydown", "touchstart"].forEach(ev => {
      window.addEventListener(ev, () => ensureAudio(), { once: true, passive: true });
    });

    // --- Kill feed ---
    const killFeed = []; // { text, life }
    function pushKillFeed(text) {
      killFeed.unshift({ text: String(text), life: 4.0 });
      if (killFeed.length > 6) killFeed.pop();
    }

    // Floating hit markers / damage numbers in world space
    const floatTexts = []; // { x, y, text, life, color, vy }
    function spawnFloatText(x, y, text, color) {
      floatTexts.push({
        x: x + (Math.random() * 16 - 8),
        y: y - 10,
        text: String(text),
        life: 0.9,
        color: color || "rgb(255, 220, 80)",
        vy: -28 - Math.random() * 12
      });
      if (floatTexts.length > 40) floatTexts.shift();
    }

    // Per-match personal stats
    let matchStats = { damageDealt: 0, damageTaken: 0, oreMined: 0, timeAlive: 0, kills: 0 };
    function resetMatchStats() {
      matchStats = { damageDealt: 0, damageTaken: 0, oreMined: 0, timeAlive: 0, kills: 0 };
    }

    // --- World events (solar flare) ---
    let worldEvent = null; // { type, timeLeft, duration }
    let worldEventCooldown = 70; // seconds until first possible flare

    // --- Host migration: lowest connected id is host ---
    function getHostId() {
      let host = Number(myId) || 1;
      for (const pid in remoteShips) {
        const id = Number(pid);
        if (Number.isFinite(id) && id < host) host = id;
      }
      return host;
    }
    function isHost() { return (Number(myId) || 1) === getHostId(); }

    // --- Rejoin last room ---
    let lastRoomCode = sessionStorage.getItem("astraclash_last_room") || "";
    let lastRoomPass = sessionStorage.getItem("astraclash_last_pass") || "";

    const stars = [];
    for (let i = 0; i < 40; i++) { stars.push({ x: Math.random() * V_WIDTH * 2, y: Math.random() * V_HEIGHT * 2, z: 0.1 + Math.random() * 0.5 }); }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 4 + 1;
        particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color, size: 2 + Math.random() * 4 });
      }
    }

    function drawCard(targetCtx, x, y, w, h, borderCol = CYAN) {
      targetCtx.fillStyle = PANEL_BG; targetCtx.fillRect(x, y, w, h);
      targetCtx.strokeStyle = borderCol; targetCtx.lineWidth = 2; targetCtx.strokeRect(x, y, w, h);
    }

    const RENDER_URL = "wss://astraclash-howt.onrender.com";
    let ws = null;
    let isConnected = false;
    let isConnecting = false;
    let connectionError = false;
    let connectStartTime = 0;

    // ACCOUNT SYSTEM STORAGE
    function getAccounts() {
      try {
        return JSON.parse(localStorage.getItem("astraclash_accounts")) || {};
      } catch(e) { return {}; }
    }
    function saveAccounts(accs) {
      localStorage.setItem("astraclash_accounts", JSON.stringify(accs));
    }

    let activePilot = JSON.parse(sessionStorage.getItem("astraclash_current_user") || "null");
    let menuMode = "connecting"; 
    let authTab = "register"; // 'register' or 'login'
    let authNameInput = "";
    let authPassInput = "";
    let authActiveField = "name"; // 'name' or 'pass'
    let authMessage = "";
    
    let statusMessage = "Booting up servers...";
    let statusColor = CYAN;

    let roomCodeInput = ""; let passwordInput = ""; let activeInput = "code";

    let myId = 1; let roomCode = ""; let inLobby = true;
    let pendingJoin = false; // true while waiting for the server to accept a join_room

    function setLobbyState(val) {
      const wasLobby = inLobby;
      inLobby = val;
      if (!val) {
        menuMode = "in_game";
        // Only reset the match when actually entering a game, never mid-match
        if (wasLobby) resetMatch();
      }
      updateTouchUIVisibility();
    }

    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return true;
      try {
        isConnecting = true;

          isConnecting = false;
          connectionError = false;
          statusMessage = "Servers online.";

          } catch(e) {}

          isConnecting = false;
          connectionError = true;
          statusMessage = "Could not reach the servers."; 
          statusColor = RAINBOW[1];
          if (inLobby) menuMode = "connecting";
        };

        ws.onclose = () => { 
          isConnected = false;
          isConnecting = false;
          statusMessage = "Disconnected from server.";

          }

        isConnected = false;

        saveAccounts(accs);

      let amount = Number(dmg) || 1;
      try { SFX.hit(); } catch (e) {}
      // Active force field absorbs hits until it breaks

        const absorb = Math.min(amount, myShip.shield_charge);
        myShip.shield_charge = Math.max(0, myShip.shield_charge - absorb);
        amount -= absorb;
        if (myShip.shield_charge <= 0.05) {

          myShip.shield_charge = 0;
          spawnParticles(myShip.world_x, myShip.world_y, CYAN, 10);

        spawnFloatText(myShip.world_x, myShip.world_y, `-${Math.round(amount)}`, "rgb(255, 90, 90)");

      myShip.hp = Math.max(0, (Number.isFinite(myShip.hp) ? myShip.hp : 6) - amount);

    function handleNetworkMessage(msg) {

            const magRSq = magR * magR;
            for (const o of payload.ores) {
              const id = Number(o.id);

    connectWs();

    let myShip = null; const remoteShips = {}; let lasers = []; let ores = []; let asteroids = [];
    // Default public match settings (private host can override)

    let matchConfig = {

      useTimer: true,

    let matchTimeLeft = matchConfig.durationSec;
    let matchOver = false;
    let matchResults = null;

    const TEAM_COLORS = {

      1: "rgb(255, 80, 80)",
      2: "rgb(80, 255, 120)"
    };
    const TEAM_NAMES = { 0: "ALPHA", 1: "BRAVO", 2: "CHARLIE" };

    function getTeam(playerId) {
      const id = Number(playerId) || 1;
      if (matchConfig.mode === "teams_3v3") return id <= 3 ? 0 : 1;
      if (matchConfig.mode === "teams_2v2v2") return Math.floor((id - 1) / 2);
      return -1; // FFA — no team
    }

    function sameTeam(a, b) {
      if (matchConfig.mode === "ffa") return Number(a) === Number(b);
      return getTeam(a) === getTeam(b);
    }

      return matchConfig.mode === "teams_3v3" || matchConfig.mode === "teams_2v2v2";
    }

    function clampMatchConfig(cfg) {
      const c = Object.assign({}, matchConfig, cfg || {});
      c.mode = ["ffa", "teams_3v3", "teams_2v2v2"].includes(c.mode) ? c.mode : "ffa";
      c.useTimer = Boolean(c.useTimer);
      c.useKills = Boolean(c.useKills);
      if (!c.useTimer && !c.useKills) c.useTimer = true; // must end somehow
      c.durationSec = Math.max(60, Math.min(MATCH_TIME_MAX_SEC, Number(c.durationSec) || 480));
      let kl = Number(c.killLimit);
      if (!Number.isFinite(kl) || kl < 0) kl = 0;
      c.killLimit = Math.floor(kl); // 0 = unlimited
      return c;
    }

      matchConfig = clampMatchConfig(cfg);
      matchTimeLeft = matchConfig.useTimer ? matchConfig.durationSec : 999999;
    }

    function resetMatch() {
      matchConfig = clampMatchConfig(matchConfig);
      matchTimeLeft = matchConfig.useTimer ? matchConfig.durationSec : 999999;
      matchOver = false;
      matchResults = null;
      matchWinnerName = "";

      for (const pid in remoteShips) {
        if (remoteShips[pid]) remoteShips[pid].kills = 0;
      }

    function getMatchStandings() {
      if (isTeamMode()) {
        const teams = {};
        const add = (id, name, kills) => {
          const t = getTeam(id);
          if (!teams[t]) teams[t] = { team: t, name: TEAM_NAMES[t] || `TEAM ${t}`, kills: 0, members: [] };
          teams[t].kills += kills || 0;
          teams[t].members.push({ name, kills: kills || 0, id });
        };
        add(myId, (myShip && myShip.name) || "YOU", (myShip && myShip.kills) || 0);
        for (const pid in remoteShips) {
          const p = remoteShips[pid];
          if (!p) continue;
          add(Number(pid), p.name || `PILOT ${pid}`, p.kills || 0);
        }
        return Object.values(teams).sort((a, b) => b.kills - a.kills);
      }

      for (const pid in remoteShips) {

        if (!p) continue;
        list.push({ name: p.name || `PILOT ${pid}`, kills: p.kills || 0, id: Number(pid) });

    let netAccumulator = 0; const NET_TICK_RATE = 0.025; // 40 Hz for snappier HP / combat sync
    let worldSyncAccumulator = 0; const WORLD_SYNC_RATE = 0.2;
    let oreRegenAccumulator = 0; const ORE_REGEN_INTERVAL = 4.0; const MAX_WORLD_ORES = 40;
    let outgoingLaserQueue = [];

    let nextOreId = 1;

    function makeOre(x, y, is_gold) {

    function applyDamageToRemote(targetId, dmg, stasisTime, creditKill) {
      const id = Number(targetId);
      const rp = remoteShips[id];
      if (!rp) return;
      const amount = Number(dmg) || 1;
      const wasAlive = rp.alive !== false && (Number.isFinite(rp.hp) ? rp.hp : 6) > 0;
      rp.hp = Math.max(0, (Number.isFinite(rp.hp) ? rp.hp : 6) - amount);
      if (amount > 0 && wasAlive) {
        matchStats.damageDealt += amount;
        spawnFloatText(rp.world_x, rp.world_y, `-${Math.round(amount)}`, "rgb(255, 220, 80)");
      }
      if (rp.hp <= 0) {
        rp.alive = false;
        rp.hp = 0;
        if (creditKill && wasAlive && myShip) {
          myShip.kills = (myShip.kills || 0) + 1;
          matchStats.kills = myShip.kills;
          recordAccountStat("kills", 1);
          pushKillFeed(`YOU DESTROYED A RIVAL`);
          spawnFloatText(rp.world_x, rp.world_y - 20, "KILL", "rgb(255, 80, 80)");
        }
      }
      if (stasisTime) rp.stasis = true;
    }

      pendingHits.push({ target: id, dmg: amount, stasis: st > 0 ? st : undefined });

    // Virtual joystick → W (thrust) / A D (turn)
    (function setupJoystick() {
      const base = document.getElementById("joy-base");
      const stick = document.getElementById("joy-stick");
      if (!base || !stick) return;
      const maxR = 38;
      let activeId = null;

      function setKeys(nx, ny) {
        // ny negative = stick up = thrust
        keysDown["KeyW"] = ny < -0.25;
        keysDown["ArrowUp"] = keysDown["KeyW"];
        keysDown["KeyA"] = nx < -0.28;
        keysDown["ArrowLeft"] = keysDown["KeyA"];
        keysDown["KeyD"] = nx > 0.28;
        keysDown["ArrowRight"] = keysDown["KeyD"];
      }

      function resetStick() {
        stick.style.transform = "translate(-50%, -50%)";
        setKeys(0, 0);
        keysDown["KeyW"] = keysDown["ArrowUp"] = false;
        keysDown["KeyA"] = keysDown["ArrowLeft"] = false;
        keysDown["KeyD"] = keysDown["ArrowRight"] = false;
        activeId = null;
      }

      function moveTo(clientX, clientY) {
        const rect = base.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const len = Math.hypot(dx, dy) || 1;
        if (len > maxR) {
          dx = (dx / len) * maxR;
          dy = (dy / len) * maxR;
        }
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        setKeys(dx / maxR, dy / maxR);
      }

      base.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        moveTo(t.clientX, t.clientY);
      }, { passive: false });

      base.addEventListener("touchmove", (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.identifier === activeId) moveTo(t.clientX, t.clientY);
        }
      }, { passive: false });

      const end = (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === activeId) resetStick();
        }
      };
      base.addEventListener("touchend", end, { passive: false });
      base.addEventListener("touchcancel", end, { passive: false });

      // Mouse fallback for desktop testing
      let mouseDrag = false;
      base.addEventListener("mousedown", (e) => {
        e.preventDefault();
        mouseDrag = true;
        moveTo(e.clientX, e.clientY);
      });
      window.addEventListener("mousemove", (e) => {
        if (mouseDrag) moveTo(e.clientX, e.clientY);
      });
      window.addEventListener("mouseup", () => {
        if (mouseDrag) { mouseDrag = false; resetStick(); }
      });
    })();

    const FIXED_STEP = 1 / 60; // physics is per-step, so run it at a fixed rate on every monitor
    let stepAccumulator = 0;
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1); 
      lastTime = now;
      try { 
        if (inLobby) {
          renderLobby(); 
        } else { 
          stepAccumulator += dt;
          let steps = 0;
          while (stepAccumulator >= FIXED_STEP && steps < 5) {
            updateGame(FIXED_STEP);
            stepAccumulator -= FIXED_STEP;
            steps++;
          }
          if (steps >= 5) stepAccumulator = 0; // too far behind, drop the backlog
          renderGame(); 
        } 
      } catch (err) { 
        console.error("GameLoop safety rescue:", err); 
      }
      ctx.fillStyle = "#000000"; 
      ctx.fillRect(0, 0, canvas.width, canvas.height); 
      ctx.drawImage(virtualCanvas, 0, 0, canvas.width, canvas.height);
      requestAnimationFrame(gameLoop);
    }

    function drawDirectShip(targetCtx, x, y, angle, color, isDead = false) {
      const rad = (angle * Math.PI) / 180;
      const size = SHIP_SIZE;
      
      const tx = x + size * Math.cos(rad);
      const ty = y - size * Math.sin(rad);
      const lx = x + size * 0.75 * Math.cos(rad + (140 * Math.PI) / 180);
      const ly = y - size * 0.75 * Math.sin(rad + (140 * Math.PI) / 180);
      const rx = x + size * 0.75 * Math.cos(rad - (140 * Math.PI) / 180);
      const ry = y - size * 0.75 * Math.sin(rad - (140 * Math.PI) / 180);

      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.moveTo(tx, ty);
      targetCtx.lineTo(lx, ly);
      targetCtx.lineTo(rx, ry);

    function updateGame(dt) {

            if (worldEvent) {

            } else {
              worldEventCooldown -= dt;

          keysDown["Enter"] = false;
          keysDown["Escape"] = false;

        netAccumulator += dt;
        if (netAccumulator >= NET_TICK_RATE) {
          netAccumulator = 0;

              action: "game_packet",
              payload: {
                ship: {
                  id: myShip.id,
                  world_x: Number(myShip.world_x.toFixed(1)),
                  world_y: Number(myShip.world_y.toFixed(1)),
                  angle: Math.round(myShip.angle),
                  hp: myShip.hp,

        if (!Number.isFinite(myShip.world_y)) myShip.world_y = 0;
        if (!Number.isFinite(myShip.vx)) myShip.vx = 0;
        if (!Number.isFinite(myShip.vy)) myShip.vy = 0;
        if (!Number.isFinite(myShip.angle)) myShip.angle = 0;
      }

      if (!matchOver && myShip && myShip.alive && myShip.hp > 0 && (1 + Object.keys(remoteShips).length) >= 2) {

      }

        const isMis = isMine ? false : Boolean(myShip.is_missile);

      for (const t of trails) { const tx = t.x - camX + cx; const ty = t.y - camY + cy; vctx.fillStyle = t.color; vctx.globalAlpha = Math.max(0, t.life); vctx.beginPath(); vctx.arc(tx, ty, 3, 0, Math.PI * 2); vctx.fill(); vctx.globalAlpha = 1.0; }

      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i]; const ax = a.x - camX + cx; const ay = a.y - camY + cy;
        if (ax >= -60 && ax <= V_WIDTH + 60 && ay >= -60 && ay <= V_HEIGHT + 60) {
          vctx.fillStyle = a.is_ore ? ORE_ASTEROID_COLOR : (a.is_bomb ? BOMB_ASTEROID_COLOR : ASTEROID_COLOR); vctx.beginPath(); vctx.arc(ax, ay, a.r, 0, Math.PI * 2); vctx.fill();
          vctx.strokeStyle = a.is_ore ? ORE_BLUE : "rgb(85, 80, 95)"; vctx.lineWidth = a.is_ore ? 3 : 2; vctx.stroke();
          if (a.is_ore) { vctx.fillStyle = ORE_BLUE; vctx.beginPath(); vctx.arc(ax, ay, a.r * 0.35, 0, Math.PI * 2); vctx.fill(); vctx.fillStyle = WHITE; vctx.beginPath(); vctx.arc(ax, ay, a.r * 0.15, 0, Math.PI * 2); vctx.fill(); } 
          else if (a.is_bomb) { const glow = Math.abs(Math.sin(performance.now() / 200)); vctx.fillStyle = `rgba(255, 100, 100, ${glow})`; vctx.beginPath(); vctx.arc(ax, ay, a.r * 0.5, 0, Math.PI * 2); vctx.fill(); }
          const barW = Math.floor(a.r * 1.5); const barH = 4; const bx = Math.floor(ax - barW / 2); const by = Math.floor(ay - a.r - 10);
          vctx.fillStyle = DARK_GRAY; vctx.fillRect(bx, by, barW, barH); const hpPct = Math.max(0.0, a.hp / (a.max_hp || 4)); vctx.fillStyle = RAINBOW[4]; vctx.fillRect(bx, by, Math.floor(barW * hpPct), barH);
        }
      }

      const pulse = Math.floor((performance.now() / 150) % 3);
      for (let i = 0; i < ores.length; i++) {
        const o = ores[i]; const ox = o.x - camX + cx; const oy = o.y - camY + cy;
        if (ox >= -20 && ox <= V_WIDTH + 20 && oy >= -20 && oy <= V_HEIGHT + 20) {
          vctx.strokeStyle = o.is_gold ? "rgb(200, 150, 0)" : "rgb(0, 100, 180)"; vctx.lineWidth = 1;
          vctx.beginPath(); vctx.arc(ox, oy, 6 + pulse, 0, Math.PI * 2); vctx.stroke();
          vctx.fillStyle = o.is_gold ? ORE_GOLD : ORE_BLUE; vctx.beginPath(); vctx.arc(ox, oy, 4, 0, Math.PI * 2); vctx.fill();
          vctx.fillStyle = WHITE; vctx.beginPath(); vctx.arc(ox, oy, 2, 0, Math.PI * 2); vctx.fill();
        }
      }

      for (let i = 0; i < lasers.length; i++) {
        const l = lasers[i]; if (!l) continue;
        const lx = l.x - camX + cx; const ly = l.y - camY + cy; const rad = (l.angle * Math.PI) / 180; const lColor = RAINBOW[Number(l.owner)] || "rgb(255, 50, 50)";
        if (l.is_stasis) { vctx.fillStyle = `rgba(0, 255, 255, 0.4)`; vctx.strokeStyle = `rgb(0, 255, 255)`; vctx.lineWidth = 2; vctx.beginPath(); vctx.arc(lx, ly, l.size, 0, Math.PI * 2); vctx.fill(); vctx.stroke(); } 
        else if (l.is_mine) { vctx.fillStyle = lColor; vctx.strokeStyle = "rgb(255, 50, 50)"; vctx.lineWidth = 2; vctx.beginPath(); vctx.arc(lx, ly, 6 + Math.sin(performance.now() / 150) * 3, 0, Math.PI * 2); vctx.fill(); vctx.stroke(); } 
        else if (l.is_missile) { vctx.fillStyle = lColor; vctx.strokeStyle = WHITE; vctx.lineWidth = 1.5; vctx.beginPath(); vctx.arc(lx, ly, 4.5, 0, Math.PI * 2); vctx.fill(); vctx.stroke(); vctx.strokeStyle = "rgb(255, 170, 40)"; vctx.lineWidth = 2; vctx.beginPath(); vctx.moveTo(lx, ly); vctx.lineTo(lx - 12 * Math.cos(rad), ly + 12 * Math.sin(rad)); vctx.stroke(); } 
        else { vctx.strokeStyle = lColor; vctx.lineWidth = 3; vctx.beginPath(); vctx.moveTo(lx, ly); vctx.lineTo(lx + 15 * Math.cos(rad), ly - 15 * Math.sin(rad)); vctx.stroke(); }
      }

      for (const p of particles) { const px = p.x - camX + cx; const py = p.y - camY + cy; vctx.fillStyle = p.color; vctx.globalAlpha = Math.max(0, p.life); vctx.fillRect(px, py, p.size, p.size); }
      vctx.globalAlpha = 1.0;

      // Hit markers / floating combat text
      vctx.textAlign = "center";
      for (const f of floatTexts) {
        const fx = f.x - camX + cx;
        const fy = f.y - camY + cy;
        if (fx < -40 || fx > V_WIDTH + 40 || fy < -40 || fy > V_HEIGHT + 40) continue;
        const a = Math.max(0, Math.min(1, f.life / 0.35));
        vctx.globalAlpha = a;
        vctx.font = "bold 14px Consolas";
        vctx.fillStyle = f.color;
        vctx.fillText(f.text, fx, fy);
      }
      vctx.globalAlpha = 1.0;

      for (const pid in remoteShips) {
        const p = remoteShips[pid]; if (!p) continue;
        const ox = p.world_x - camX + cx; const oy = p.world_y - camY + cy;
        const rCol = p.color || RAINBOW[Number(p.id)] || RAINBOW[2];

        if (ox >= -50 && ox <= V_WIDTH + 50 && oy >= -50 && oy <= V_HEIGHT + 50) {
          drawDirectShip(vctx, ox, oy, p.angle, rCol, !p.alive || p.hp <= 0);

          if (p.stasis) { 
            vctx.fillStyle = `rgba(200, 200, 255, 0.4)`; vctx.strokeStyle = `rgb(255, 255, 255)`; vctx.beginPath(); 
            vctx.arc(ox, oy, SHIP_SIZE + 15, 0, Math.PI * 2); vctx.fill(); vctx.stroke(); 
          }
          // Visible force field on other pilots
          if (p.is_charging_shield && (p.shield_charge || 0) > 0) {
            const charge = p.shield_charge || 0;
            const chargeRad = 18 + charge * 28;
            vctx.fillStyle = `rgba(0, 200, 255, ${0.12 + charge * 0.08})`;
            vctx.beginPath();
            vctx.arc(ox, oy, chargeRad + 6, 0, Math.PI * 2);
            vctx.fill();
            vctx.fillStyle = `rgba(0, 255, 255, ${0.18 + charge * 0.1})`;
            vctx.strokeStyle = `rgb(0, 255, 255)`;
            vctx.lineWidth = 2 + charge * 0.6;
            vctx.beginPath();
            vctx.arc(ox, oy, chargeRad, 0, Math.PI * 2);
            vctx.fill();
            vctx.stroke();
          }
          vctx.font = "bold 10px Consolas";
          vctx.fillStyle = isTeamMode() ? (TEAM_COLORS[getTeam(p.id)] || WHITE) : WHITE;
          vctx.textAlign = "center"; vctx.fillText(p.name, ox, oy - 38);
          vctx.fillStyle = "rgb(255, 50, 50)"; vctx.fillRect(ox - 17, oy - 28, 34, 5); 
          const pct = Math.max(0.0, Math.min(1.0, p.hp / (p.max_hp || 6))); vctx.fillStyle = RAINBOW[4]; vctx.fillRect(ox - 17, oy - 28, Math.floor(34 * pct), 5);
        } else { 
          const dx = p.world_x - camX; const dy = p.world_y - camY;
          if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
            const pad = 26;
            const s = Math.min((V_WIDTH / 2 - pad) / Math.abs(dx || 0.001), (V_HEIGHT / 2 - pad) / Math.abs(dy || 0.001));
            if (Number.isFinite(s)) {
              const ex = V_WIDTH / 2 + dx * s; const ey = V_HEIGHT / 2 + dy * s;
              const arrowAng = Math.atan2(dy, dx);
              vctx.save();
              vctx.translate(ex, ey);
              vctx.rotate(arrowAng);
              // Triangle arrow pointing toward the off-screen ship
              vctx.beginPath();
              vctx.moveTo(11, 0);
              vctx.lineTo(-7, -8);
              vctx.lineTo(-3, 0);
              vctx.lineTo(-7, 8);
              vctx.closePath();
              vctx.fillStyle = rCol;
              vctx.strokeStyle = WHITE;
              vctx.lineWidth = 1.5;
              vctx.fill();
              vctx.stroke();
              vctx.rotate(-arrowAng);
              vctx.font = "bold 9px Consolas";
              vctx.fillStyle = WHITE;
              vctx.textAlign = "center";
              vctx.fillText(p.name, 0, -14);
              vctx.restore();
            }
          }
        }
      }

      const isDead = !myShip.alive || myShip.hp <= 0;
      drawDirectShip(vctx, cx, cy, myShip.angle, myShip.color, isDead);
      if (!isDead && (myShip.invuln_timer || 0) > 0) {
        const blink = Math.sin(performance.now() / 80) > 0;
        if (blink) {
          vctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
          vctx.lineWidth = 2;
          vctx.beginPath();
          vctx.arc(cx, cy, SHIP_SIZE + 8, 0, Math.PI * 2);
          vctx.stroke();
        }
        vctx.font = "9px Consolas";
        vctx.fillStyle = WHITE;
        vctx.textAlign = "center";
        vctx.fillText("SAFE — FIRE TO ARM", cx, cy + SHIP_SIZE + 18);
      }

      if (myShip.is_charging_shield) {
        const charge = myShip.shield_charge || 0;
        const chargeRad = 18 + charge * 28;
        // Outer soft glow
        vctx.fillStyle = `rgba(0, 200, 255, ${0.12 + charge * 0.08})`;
        vctx.beginPath();
        vctx.arc(cx, cy, chargeRad + 6, 0, Math.PI * 2);
        vctx.fill();
        // Main force field bubble around the ship
        vctx.fillStyle = `rgba(0, 255, 255, ${0.18 + charge * 0.1})`;
        vctx.strokeStyle = `rgb(0, 255, 255)`;
        vctx.lineWidth = 2 + charge * 0.6;
        vctx.beginPath();
        vctx.arc(cx, cy, chargeRad, 0, Math.PI * 2);
        vctx.fill();
        vctx.stroke();
        // Inner ring
        vctx.strokeStyle = `rgba(180, 255, 255, 0.7)`;
        vctx.lineWidth = 1;
        vctx.beginPath();
        vctx.arc(cx, cy, Math.max(12, chargeRad * 0.55), 0, Math.PI * 2);
        vctx.stroke();
      }

      if (myShip.stasis_timer > 0) {
        vctx.fillStyle = `rgba(200, 200, 255, 0.4)`; vctx.strokeStyle = `rgb(255, 255, 255)`;
        vctx.beginPath(); vctx.arc(cx, cy, SHIP_SIZE + 15, 0, Math.PI * 2); vctx.fill(); vctx.stroke();
        vctx.fillStyle = WHITE; vctx.textAlign = "center"; vctx.font = "bold 14px Consolas"; vctx.fillText("STASIS", cx, cy - 40);
      }

      vctx.font = "bold 10px Consolas"; vctx.fillStyle = WHITE; vctx.textAlign = "center"; vctx.fillText(myShip.name, cx, cy - 38);
      vctx.fillStyle = "rgb(255, 50, 50)"; vctx.fillRect(cx - 17, cy - 28, 34, 5); 
      const hpPct = Math.max(0.0, Math.min(1.0, myShip.hp / myShip.max_hp)); 
      vctx.fillStyle = RAINBOW[4]; vctx.fillRect(cx - 17, cy - 28, Math.floor(34 * hpPct), 5);

      if (isDead) {
        vctx.font = "bold 28px Consolas"; vctx.fillStyle = RAINBOW[1]; vctx.textAlign = "center"; vctx.fillText("HULL DESTROYED", cx, cy - 15);
        vctx.font = "18px Consolas"; vctx.fillStyle = WHITE; vctx.fillText(`RESPAWNING IN ${Math.max(1, Math.ceil(myShip.respawn_timer))}s`, cx, cy + 20);
      }

      {
        const board = isTeamMode() ? getMatchStandings() : (
          [{ name: myShip.name, kills: myShip.kills || 0 }].concat(Object.values(remoteShips).map(p => ({ name: p.name, kills: p.kills || 0 }))).sort((a, b) => b.kills - a.kills)
        );
        vctx.fillStyle = "rgba(10, 10, 20, 0.7)";
        vctx.fillRect(V_WIDTH - 170, 80, 160, 25 + board.length * 20);
        vctx.font = "bold 12px Consolas"; vctx.textAlign = "left"; vctx.fillStyle = CYAN;
        vctx.fillText(isTeamMode() ? "TEAMS" : "LEADERBOARD", V_WIDTH - 160, 95);
        for (let i = 0; i < board.length; i++) {
          const k = board[i].kills || 0;
          if (isTeamMode()) {
            vctx.fillStyle = TEAM_COLORS[board[i].team] || WHITE;
            vctx.fillText(`#${i+1} ${board[i].name} - ${k}`, V_WIDTH - 160, 115 + i * 20);
          } else {
            vctx.fillStyle = WHITE;
            vctx.fillText(`#${i+1} ${board[i].name} - ${k} kill${k === 1 ? "" : "s"}`, V_WIDTH - 160, 115 + i * 20);
          }
        }
      }

      // Match timer (center-top under XP bar)
      const mt = Math.max(0, matchTimeLeft);
      const mins = Math.floor(mt / 60);
      const secs = Math.floor(mt % 60);
      const hasTimer = matchConfig.useTimer;
      const timeStr = hasTimer ? `${mins}:${secs.toString().padStart(2, "0")}` : "\u221E";
      vctx.font = hasTimer ? "bold 16px Consolas" : "bold 20px Consolas";
      vctx.textAlign = "center";
      vctx.fillStyle = !hasTimer ? WHITE : (mt <= 30 ? RAINBOW[1] : (mt <= 60 ? RAINBOW[3] : WHITE));
      vctx.fillText(timeStr, V_WIDTH / 2, 70);
      vctx.font = "10px Consolas";
      vctx.fillStyle = GRAY;
      let ruleBits = [];
      if (matchConfig.mode === "teams_3v3") ruleBits.push("3v3");
      else if (matchConfig.mode === "teams_2v2v2") ruleBits.push("2v2v2");
      else ruleBits.push("FFA");
      if (matchConfig.useKills) ruleBits.push(matchConfig.killLimit > 0 ? `TO ${matchConfig.killLimit}` : "KILLS OPEN");
      if (matchConfig.useTimer) ruleBits.push("TIMED");
      vctx.fillText(ruleBits.join("  ·  "), V_WIDTH / 2, 84);

      const bm = 20; const by = 18; const bw = V_WIDTH - 40; const bh = 14;
      const atMaxTier = myShip.tier >= TIER_XP_THRESHOLDS.length - 1;
      vctx.fillStyle = XP_BG; vctx.fillRect(bm, by, bw, bh);
      if (atMaxTier) {
        // Tier 5+: top bar becomes full-width mana (cyan)
        const manaPctTop = Math.max(0, Math.min(1, myShip.mana / myShip.max_mana));

        vctx.strokeStyle = CYAN;
        vctx.lineWidth = 2;
        vctx.strokeRect(bm, by, bw, bh);
        vctx.font = "bold 10px Consolas";
        vctx.fillStyle = WHITE;
        vctx.textAlign = "center";
        vctx.fillText(`MANA  ${Math.floor(myShip.mana)}/${Math.floor(myShip.max_mana)}`, V_WIDTH / 2, by + 11);
      } else {
        // Fill relative to current tier → next upgrade
        const tierIdx = Math.max(0, Math.min(myShip.tier, TIER_XP_THRESHOLDS.length - 1));
        const xpFloor = TIER_XP_THRESHOLDS[tierIdx] || 0;
        const xpCeil = TIER_XP_THRESHOLDS[Math.min(tierIdx + 1, TIER_XP_THRESHOLDS.length - 1)] || xpFloor;
        let prog = 1.0;
        if (xpCeil > xpFloor) prog = Math.min(1.0, Math.max(0, (myShip.xp - xpFloor) / (xpCeil - xpFloor)));
        vctx.fillStyle = XP_BLUE;
        vctx.fillRect(bm, by, Math.floor(bw * prog), bh);
        vctx.strokeStyle = GRAY;
        vctx.lineWidth = 2;
        vctx.strokeRect(bm, by, bw, bh);
      }

      // Force field strength bar
      if (myShip.has_stasis_field) {
        const fieldY = 42;
        const fieldPct = Math.min(1, (myShip.shield_charge || 0) / 3.0);
        vctx.fillStyle = XP_BG;
        vctx.fillRect(20, fieldY, 140, 8);
        vctx.fillStyle = fieldPct > 0 ? "rgb(40, 180, 255)" : "rgb(30, 50, 70)";
        vctx.fillRect(20, fieldY, Math.floor(140 * fieldPct), 8);
        vctx.strokeStyle = "rgba(0, 180, 255, 0.6)";
        vctx.lineWidth = 1;
        vctx.strokeRect(20, fieldY, 140, 8);
      }

      let apLabel = "LOCKED";
      if (myShip.can_dash) apLabel = myShip.dash_cooldown <= 0 && myShip.mana >= 40 ? "PHASE DASH READY" : "RECHARGING";
      else if (myShip.has_stasis_field) {
        apLabel = myShip.is_charging_shield ? "E AGAIN TO LAUNCH" : "PRESS E FOR FIELD";
      } else apLabel = "PASSIVE ONLY";
      vctx.font = "11px Consolas"; vctx.textAlign = "left";
      const abilY = myShip.has_stasis_field ? 62 : 50;
      vctx.fillStyle = (myShip.can_dash && myShip.dash_cooldown <= 0) || myShip.has_stasis_field ? CYAN : WHITE;
      vctx.fillText(`ABILITY (E): ${apLabel}`, 20, abilY);

      // Kill feed — left side, right under the XP/mana bar
      vctx.font = "11px Consolas";
      vctx.textAlign = "left";
      const feedY0 = 36;
      for (let i = 0; i < killFeed.length; i++) {
        const a = Math.min(1, killFeed[i].life);
        vctx.fillStyle = `rgba(255, 220, 180, ${a})`;
        vctx.fillText(killFeed[i].text, 20, feedY0 + i * 14);
      }

      // Minimap — only if 5+ kills behind the pilot ranked directly above you
      {
        const board = [{ name: myShip.name, kills: myShip.kills || 0, id: myId }]
          .concat(Object.values(remoteShips).map(p => ({ name: p.name, kills: p.kills || 0, id: p.id })))
          .sort((a, b) => b.kills - a.kills);
        let myRank = board.findIndex(e => e.id === myId);
        if (myRank < 0) myRank = 0;
        let showRadar = false;
        if (myRank > 0) {
          const above = board[myRank - 1];
          const gap = (above.kills || 0) - (myShip.kills || 0);
          showRadar = gap >= 5;
        }
        if (showRadar) {
          const mmS = 110, mmX = 20, mmY = V_HEIGHT - mmS - 16;
          const scale = mmS / (WORLD_BOUND * 2);
          vctx.fillStyle = "rgba(8, 12, 24, 0.75)";
          vctx.fillRect(mmX, mmY, mmS, mmS);
          vctx.strokeStyle = "rgba(0, 255, 255, 0.5)";
          vctx.lineWidth = 1;
          vctx.strokeRect(mmX, mmY, mmS, mmS);
          const toM = (wx, wy) => ({
            x: mmX + mmS / 2 + wx * scale,
            y: mmY + mmS / 2 + wy * scale
          });
          for (const a of asteroids) {
            const p = toM(a.x, a.y);
            vctx.fillStyle = a.is_bomb ? "rgb(200, 60, 60)" : (a.is_ore ? "rgb(40, 120, 200)" : "rgb(80, 80, 90)");
            vctx.fillRect(p.x - 1, p.y - 1, 2, 2);
          }
          for (const pid in remoteShips) {
            const r = remoteShips[pid];
            if (!r || !r.alive) continue;
            const p = toM(r.world_x, r.world_y);
            vctx.fillStyle = RAINBOW[Number(r.id)] || WHITE;
            vctx.beginPath(); vctx.arc(p.x, p.y, 3, 0, Math.PI * 2); vctx.fill();
          }
          if (myShip) {
            const p = toM(myShip.world_x, myShip.world_y);
            vctx.fillStyle = CYAN;
            vctx.beginPath(); vctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); vctx.fill();
          }
          vctx.font = "9px Consolas"; vctx.fillStyle = CYAN; vctx.textAlign = "left";
          vctx.fillText("RADAR (CATCH-UP)", mmX + 4, mmY + 12);
        }
      }

      // Solar flare screen tint + banner
      if (worldEvent && worldEvent.type === "solar_flare") {
        const t = worldEvent.timeLeft / (worldEvent.duration || 10);
        vctx.fillStyle = `rgba(255, 80, 20, ${0.08 + 0.1 * Math.sin(performance.now() / 200)})`;
        vctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        vctx.font = "bold 14px Consolas";
        vctx.textAlign = "center";
        vctx.fillStyle = RAINBOW[1];
        vctx.fillText(`SOLAR FLARE  ${Math.ceil(worldEvent.timeLeft)}s  ·  ORE SURGE`, V_WIDTH / 2, V_HEIGHT - 24);
      }

      // Waiting for second player banner
      if (!matchOver && 1 + Object.keys(remoteShips).length < 2) {
        vctx.font = "bold 13px Consolas";
        vctx.textAlign = "center";
        vctx.fillStyle = RAINBOW[3];
        vctx.fillText("WAITING FOR PLAYERS — CLOCK PAUSED", V_WIDTH / 2, V_HEIGHT - 48);
      }

      if (!matchOver && myShip.alive && myShip.hp > 0) {
        const currentNode = myShip.current_node; const options = UPGRADE_TREE[currentNode]?.children || []; const nextTier = myShip.tier + 1;
        if (options.length > 0 && nextTier < TIER_XP_THRESHOLDS.length && myShip.xp >= TIER_XP_THRESHOLDS[nextTier]) {
          drawCard(vctx, V_WIDTH / 2 - 275, 38, 550, 46, RAINBOW[4]);
          for (let i = 0; i < Math.min(options.length, 3); i++) {
            const optKey = options[i]; const optData = UPGRADE_TREE[optKey]; vctx.font = "bold 11px Consolas"; vctx.fillStyle = i === 0 ? WHITE : (i === 1 ? RAINBOW[3] : CYAN);
            vctx.fillText(`[${i + 1}] ${optData.name}: ${optData.desc}`, V_WIDTH / 2 - 265, 50 + i * 13);
          }
        }
      }

      // Match results overlay
      if (matchOver) {
        vctx.fillStyle = "rgba(5, 8, 18, 0.82)";
        vctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        drawCard(vctx, V_WIDTH / 2 - 220, 100, 440, 340, CYAN);
        vctx.textAlign = "center";
        vctx.font = "bold 28px Consolas";
        vctx.fillStyle = CYAN;
        vctx.fillText("MATCH COMPLETE", V_WIDTH / 2, 165);
        vctx.font = "bold 18px Consolas";
        vctx.fillStyle = RAINBOW[3];
        vctx.fillText(`WINNER: ${matchWinnerName || "—"}`, V_WIDTH / 2, 200);
        const board = matchResults || getMatchStandings();
        vctx.font = "14px Consolas";
        vctx.textAlign = "left";
        for (let i = 0; i < Math.min(board.length, 6); i++) {
          const k = board[i].kills || 0;
          if (isTeamMode()) {
            vctx.fillStyle = TEAM_COLORS[board[i].team] || WHITE;
            vctx.fillText(`${i + 1}. ${board[i].name}`, V_WIDTH / 2 - 160, 228 + i * 20);
            vctx.fillText(`${k} kills`, V_WIDTH / 2 + 80, 228 + i * 20);
          } else {
            vctx.fillStyle = i === 0 ? RAINBOW[4] : WHITE;
            vctx.fillText(`${i + 1}. ${board[i].name}`, V_WIDTH / 2 - 160, 228 + i * 20);
            vctx.fillText(`${k} kill${k === 1 ? "" : "s"}`, V_WIDTH / 2 + 80, 228 + i * 20);
          }
        }
        // Personal match stats
        const aliveM = Math.floor(matchStats.timeAlive / 60);
        const aliveS = Math.floor(matchStats.timeAlive % 60);
        const aliveStr = `${aliveM}:${aliveS.toString().padStart(2, "0")}`;
        vctx.font = "bold 12px Consolas";
        vctx.fillStyle = CYAN;
        vctx.textAlign = "center";
        vctx.fillText("YOUR STATS", V_WIDTH / 2, 360);
        vctx.font = "12px Consolas";
        vctx.fillStyle = WHITE;
        vctx.fillText(
          `DMG ${Math.round(matchStats.damageDealt)}   TAKEN ${Math.round(matchStats.damageTaken)}   ORE ${matchStats.oreMined}   ALIVE ${aliveStr}`,
          V_WIDTH / 2,
          380
        );
        vctx.textAlign = "center";
        vctx.font = "12px Consolas";
        vctx.fillStyle = GRAY;
        vctx.fillText("PRESS SPACE / ENTER — RETURN TO HANGAR", V_WIDTH / 2, 415);
      }
    }
  </script>
</body>
